}
function renderResults(){
  const scored = S.mode === "exam" ? S.ids : S.ids.filter(isGraded);
  const un = S.ids.filter(id => status(id) === "skip");
  const full = scored.filter(id => score(id).full).length;
  let pts = 0, max = 0; scored.forEach(id => { const r = score(id); pts += r.pts; max += r.max; });
  const p = pct(full, scored.length), fl = S.ids.filter(id => S.flags[id]).length;
  const missed = S.ids.filter(id => status(id) !== "ok").length;
  const topics = groupStats(scored, q => q.topic, TOPICS);
  const weak = topics.filter(([, g]) => g.n >= 2 && pct(g.full, g.n) < 70).map(([k]) => k);
  const types = groupStats(scored, q => q.type, ["sata", "mc"]);
  const ncj = groupStats(scored, q => q.ncj, NCJ_ORDER);
  const answeredN = scored.filter(id => score(id).answered).length;
  app.innerHTML = `
  <header class="topbar"><div class="wrap tb"><button type="button" class="brand" data-act="home">${IC.home}<span>Repro NGN</span></button><span class="counter">Results</span></div></header>
  <main class="wrap page">
    <div><p class="eyebrow">${S.mode === "exam" ? "Exam" : "Practice"} · ${S.ids.length} items · ${new Date(S.started).toLocaleDateString(undefined, { month:"short", day:"numeric", year:"numeric" })}</p><h1>Your results</h1></div>
    ${scored.length ? `
    <div class="res-top">
      <div class="big ${band(p)}"><span class="num">${p}<small>%</small></span><span class="h-sm">Fully correct · ${full} of ${scored.length}</span></div>
      <dl class="metrics">
        <div><dt>NGN points</dt><dd>${pct(pts, max)}%<small>${pts} of ${max} with SATA partial credit</small></dd></div>
        <div><dt>${S.limit ? "Time used" : "Time"}</dt><dd>${fmt(S.elapsed)}<small>${answeredN ? Math.round(S.elapsed / answeredN) + " sec per answered item" : "No items answered"}</small></dd></div>
        <div><dt>Not answered</dt><dd>${un.length}<small>${S.mode === "exam" ? "Scored as 0" : "Not included in your score"}</small></dd></div>
        <div><dt>Flagged</dt><dd>${fl}<small>Review them below</small></dd></div>
      </dl>
    </div>
    ${weak.length ? `<p class="focus"><b>Focus next on:</b> ${weak.map(esc).join(", ")}. These topics came in under 70% fully correct.</p>` : ""}` : `<p class="focus">No items were submitted in this session, so there is nothing to score yet.</p>`}
    <div class="row">
      <button type="button" class="btn primary" data-act="rv-all">Review all answers</button>
      <button type="button" class="btn" data-act="rv-missed" ${missed ? "" : "disabled"}>Review missed (${missed})</button>
      <button type="button" class="btn" data-act="rv-flagged" ${fl ? "" : "disabled"}>Review flagged (${fl})</button>
      <button type="button" class="btn" data-act="retake" ${missed ? "" : "disabled"}>Retake missed</button>
      <button type="button" class="btn ghost" data-act="home">New session</button>
    </div>
    ${scored.length ? `
    <section class="card"><h2>By topic</h2>${bdHTML(topics)}</section>
    <div class="two">
      <section class="card"><h2>By item type</h2>${bdHTML(types, k => k === "sata" ? "SATA" : "Multiple choice")}</section>
      <section class="card"><h2>By clinical judgment step</h2>${bdHTML(ncj)}</section>
    </div>
    <section class="card"><h2>Every item</h2>${legendHTML()}${navGridHTML(S.ids, -1)}</section>` : ""}
  </main>`;
}
function startReview(kind, startIx){
  let list = S.ids.slice();
  if (kind === "missed") list = list.filter(id => status(id) !== "ok");
  if (kind === "flagged") list = list.filter(id => S.flags[id]);
  if (!list.length){ toast("No items to review."); return; }
  rv = { list, pos: 0 };
  if (startIx != null){ const p = list.indexOf(S.ids[startIx]); rv.pos = p < 0 ? 0 : p; }
  chartTab = 0; go("review");
}

/* ---------- OVERLAYS ---------- */
function closeOverlay(){ oroot.innerHTML = ""; overlay = null; }
function openNav(){
  const review = view === "review";
  const ids = review ? rv.list : S.ids, cur = review ? rv.pos : S.cur;
  const a = S.ids.filter(isAnswered).length, f = S.ids.filter(id => S.flags[id]).length;
  overlay = "nav";
  oroot.innerHTML = `<div class="ov" data-ov="1"><div class="panel" role="dialog" aria-modal="true" aria-labelledby="nav-h">
    <div class="panel-head"><h2 id="nav-h">${review ? "Review items" : "Items"}</h2><span class="spacer"></span><button type="button" class="tbtn" data-act="close" id="nav-close">Close</button></div>
    <div class="panel-body"><p class="meta muted">${review ? `${ids.length} items in this review` : `${a} of ${S.ids.length} answered · ${f} flagged`}</p>${legendHTML()}${navGridHTML(ids, cur)}
    ${!review && S.mode === "exam" ? `<button type="button" class="btn primary" data-act="end">Review &amp; submit</button>` : ""}</div></div></div>`;
  $("#nav-close").focus();
}
function modal(title, body, actions){
  overlay = "modal";
  oroot.innerHTML = `<div class="ov center" data-ov="1"><div class="dlg" role="alertdialog" aria-modal="true" aria-labelledby="dlg-h"><h2 id="dlg-h">${title}</h2><p>${body}</p>
    <div class="row">${actions.map((a, i) => `<button type="button" class="btn ${a.primary ? "primary" : ""}" data-dlg="${i}">${a.label}</button>`).join("")}</div></div></div>`;
  oroot.querySelectorAll("[data-dlg]").forEach(b => b.addEventListener("click", () => { const a = actions[+b.dataset.dlg]; closeOverlay(); if (a.fn) a.fn(); }));
  const pb = oroot.querySelector(".btn.primary") || oroot.querySelector("[data-dlg]"); if (pb) pb.focus();
}

/* ---------- ACTIONS ---------- */
function act(name, el){
  const review = view === "review";
  switch (name){
    case "home": closeOverlay(); go("home"); break;
    case "resume": go(S.finished ? "results" : "quiz"); break;
    case "discard":
      modal("Discard this session?", "Your answers in this session will be lost. Your history from finished sessions stays.", [
        { label:"Keep it" }, { label:"Discard", primary:true, fn(){ S = null; store.del(K_SESSION); renderHome(); } }]);
      break;
    case "reset-hist":
      if (!resetArmed){ resetArmed = true; el.textContent = "Tap again to clear your history"; setTimeout(() => { resetArmed = false; const b = $("#reset-hist"); if (b) b.textContent = "Clear my answer history"; }, 4000); }
      else { resetArmed = false; H = {}; store.del(K_HIST); el.textContent = "History cleared"; syncHome(); }
      break;
    case "topics-all": prefs.topics = TOPICS.slice(); store.set(K_PREFS, prefs); syncHome(); break;
    case "topics-none": prefs.topics = []; store.set(K_PREFS, prefs); syncHome(); break;
    case "tab": {
      chartTab = +el.dataset.t; const ex = $(".exhibit"); const q = QMAP.get(curId());
      if (ex){ ex.outerHTML = exhibitHTML(q); const tb = $(`#tab-${chartTab}`); if (tb) tb.focus(); }
      break; }
    case "strike": {
      const id = curId(), i = +el.dataset.i; if (isGraded(id) || review) break;
      const s = new Set(S.strike[id] || []); s.has(i) ? s.delete(i) : s.add(i); S.strike[id] = [...s];
      if (s.has(i) && (S.ans[id] || []).includes(i)){ S.ans[id] = S.ans[id].filter(x => x !== i); }
      saveS(); renderItem(); const b = app.querySelector(`.strike[data-i="${i}"]`); if (b) b.focus({ preventScroll:true });
      break; }
    case "flag": { const id = curId(); S.flags[id] = !S.flags[id]; if (!S.flags[id]) delete S.flags[id]; saveS(); renderItem(); const b = $("[data-act=flag]"); if (b) b.focus(); break; }
    case "nav": openNav(); break;
    case "close": closeOverlay(); break;
    case "goto": {
      const ix = +el.dataset.ix; closeOverlay();
      if (view === "results"){ startReview("all", ix); break; }
      if (review){ rv.pos = ix; } else { S.cur = ix; saveS(); }
      chartTab = 0; go(view === "submit" ? "quiz" : view); break; }
    case "prev": if (review){ if (rv.pos > 0){ rv.pos--; chartTab = 0; go("review"); } } else if (S.cur > 0){ S.cur--; saveS(); chartTab = 0; go("quiz"); } break;
    case "next":
      if (review){ if (rv.pos < rv.list.length - 1){ rv.pos++; chartTab = 0; go("review"); } }
      else if (S.cur < S.ids.length - 1){ S.cur++; saveS(); chartTab = 0; go("quiz"); }
      else if (S.mode === "exam") go("submit");
      break;
    case "skip": {
      const nx = nextUnanswered(S.cur);
      if (nx < 0){
        if (S.mode === "exam") go("submit");
        else if (S.ids.every(isAnswered)) finishPractice();
        else toast("This is the only unanswered item left.");
      } else { S.cur = nx; saveS(); chartTab = 0; go("quiz"); }
      break; }
    case "submit": {
      const id = curId(); if (!(S.ans[id] || []).length || isGraded(id)) break;
      S.sub[id] = true; rec(id); store.set(K_HIST, H); saveS(); renderItem();
      const fb = $("#fb"); if (fb) fb.scrollIntoView({ behavior: reduceMotion() ? "auto" : "smooth", block:"nearest" });
      const nb = app.querySelector(".act .btn.primary"); if (nb) nb.focus({ preventScroll:true });
      break; }
    case "end":
      closeOverlay();
      if (S.mode === "exam") go("submit");
      else {
        const a = S.ids.filter(isAnswered).length;
        modal("End this practice session?", `You've submitted ${a} of ${S.ids.length} items. Items you didn't submit won't count toward your score.`, [
          { label:"Keep going" }, { label:"End and see results", primary:true, fn: finishPractice }]);
      }
      break;
    case "finish": finishPractice(); break;
    case "back-exam": go("quiz"); break;
    case "submit-exam": {
      const un = S.ids.filter(id => !isAnswered(id)).length;
      if (un) modal("Submit with unanswered items?", `${un} item${un === 1 ? " is" : "s are"} unanswered and will score 0.`, [{ label:"Go back" }, { label:"Submit exam", primary:true, fn(){ finishExam(false); } }]);
      else modal("Submit your exam?", "You won't be able to change your answers after this.", [{ label:"Go back" }, { label:"Submit exam", primary:true, fn(){ finishExam(false); } }]);
      break; }
    case "results": closeOverlay(); go("results"); break;
    case "rv-all": startReview("all"); break;
    case "rv-missed": startReview("missed"); break;
    case "rv-flagged": startReview("flagged"); break;
    case "retake": {
      const ids = S.ids.filter(id => status(id) !== "ok"); if (!ids.length) break;
      const mode = S.mode;
      const lim = mode === "exam" && prefs.limit !== "none" ? ids.length * (+prefs.limit) : 0;
      startSession(prefs.shuffleQ ? shuffle(ids) : ids, mode, { shuffleO: prefs.shuffleO, limit: lim });
      break; }
  }
}
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (el && (app.contains(el) || oroot.contains(el))){ e.preventDefault(); act(el.dataset.act, el); return; }
  if (e.target.dataset && e.target.dataset.ov) closeOverlay();
});
app.addEventListener("change", e => { if (e.target.name === "opt") onSelect(e.target); });
document.addEventListener("keydown", e => {
  if (overlay){ if (e.key === "Escape"){ e.preventDefault(); closeOverlay(); } return; }
  if (view !== "quiz" && view !== "review") return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "textarea" || tag === "select" || (tag === "input" && !/checkbox|radio/.test(e.target.type))) return;
  const k = e.key;
  if (/^[1-8]$/.test(k) && view === "quiz"){ e.preventDefault(); toggleOpt(+k - 1); return; }
  if (k === "ArrowRight"){ e.preventDefault(); act("next"); return; }
  if (k === "ArrowLeft"){ e.preventDefault(); act("prev"); return; }
  if ((k === "f" || k === "F")){ e.preventDefault(); act("flag"); return; }
  if ((k === "s" || k === "S") && view === "quiz" && !isGraded(curId())){ e.preventDefault(); act("skip"); return; }
  if (k === "Enter" && (tag === "body" || tag === "input" || tag === "div")){
    e.preventDefault();
    if (view === "review") act("next");
    else if (S.mode === "practice" && !isGraded(curId())) act("submit");
    else { const pb = app.querySelector(".act .btn.primary"); if (pb && !pb.disabled) act(pb.dataset.act, pb); }
  }
});

/* ---------- timer ---------- */
setInterval(() => {
  if (!S || S.finished || overlay === "modal" || document.hidden) return;
  if (view !== "quiz" && view !== "submit") return;
  S.elapsed++;
  if (S.limit && S.elapsed >= S.limit){ S.elapsed = S.limit; finishExam(true); return; }
  const t = $("#timer"); if (t){ const tt = timerText(); t.textContent = tt.t; t.classList.toggle("low", tt.low); }
  if (S.elapsed % 5 === 0) saveS();
}, 1000);
window.addEventListener("pagehide", saveS);

/* ---------- boot ---------- */
function start(data){
  data = data || {};
  S = data.S || store.get(K_SESSION);
  if (S && (!Array.isArray(S.ids) || !S.ids.length || !S.ids.every(id => QMAP.has(id)))) S = null;
  if (data.rv && Array.isArray(data.rv.list)) rv = data.rv;
  view = S && data.view ? data.view : "home";
  if (view === "review" && !rv.list.length) view = "results";
  if (S && !S.finished && (view === "results" || view === "review")) view = "home";
  if (S && S.finished && (view === "quiz" || view === "submit")) view = "results";
  render();
}
try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ S, view, rv })); } catch(e){}
try {
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
  else start(window.claude && window.claude.hot && window.claude.hot.data || {});
} catch(e){ start({}); }
})();
</script>
</body>
</html>
