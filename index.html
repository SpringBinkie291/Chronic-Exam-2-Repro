androgens to estrone, giving unopposed estrogen stimulation of the endometrium."},{"t":"\"Obesity makes HPV infection of the uterus more likely.\"","c":false,"r":"HPV is linked to cervical cancer, not endometrial cancer."},{"t":"\"The extra weight presses on your uterus and damages the lining.\"","c":false,"r":"The link is hormonal, not mechanical."},{"t":"\"Obesity lowers estrogen, which thins the uterine lining and makes it cancerous.\"","c":false,"r":"The reverse is true. Obesity increases estrogen."}],"key":"Obesity raises endometrial cancer risk through unopposed estrogen made in fat tissue.","chart":[],"id":43},{"topic":"Endometrial Cancer","type":"sata","ncj":"Evaluate Outcomes","stem":"The nurse provides discharge teaching to a client after a TAH-BSO for endometrial cancer. Which statements by the client indicate understanding? <b>Select all that apply.<\/b>","o":[{"t":"\"I'll avoid heavy lifting and intercourse until my surgeon clears me.\"","c":true,"r":"Protects the vaginal cuff and abdominal incision while they heal."},{"t":"\"I won't have periods anymore.\"","c":true,"r":"The uterus has been removed."},{"t":"\"I might have hot flashes since my ovaries were removed.\"","c":true,"r":"Removing the ovaries causes surgical menopause if she wasn't already postmenopausal."},{"t":"\"I'll call if I have heavy bleeding, foul-smelling discharge, or a fever.\"","c":true,"r":"These signal hemorrhage or infection."},{"t":"\"I can use tampons for any spotting after I get home.\"","c":false,"r":"Nothing goes in the vagina until the surgeon clears it."},{"t":"\"My uterus is gone, so I don't need any more follow-up visits.\"","c":false,"r":"Follow-up care is essential to watch for recurrence."}],"key":"After TAH-BSO: no periods, possible menopause symptoms, nothing in the vagina and no heavy lifting until cleared, report bleeding or infection, keep follow-up.","chart":[],"id":44},{"topic":"Ovarian Cancer","type":"sata","ncj":"Recognize Cues","stem":"Which findings are consistent with ovarian cancer? <b>Select all that apply.<\/b>","o":[{"t":"Persistent bloating","c":true,"r":"Bloating is one of the key early symptoms."},{"t":"Menopause at age 51","c":false,"r":"That's a normal age. Late menopause is the risk factor."},{"t":"Feeling full after a few bites","c":true,"r":"Difficulty eating and early satiety are classic."},{"t":"Larger waistline despite eating less","c":true,"r":"Increasing abdominal girth suggests ascites or tumor growth."},{"t":"Urinary urgency and frequency","c":true,"r":"Pressure on the bladder causes urinary symptoms."},{"t":"Vague lower abdominal pressure","c":true,"r":"Pelvic or abdominal pain or pressure is common."}],"key":"Ovarian cancer: persistent bloating, early satiety, pelvic or abdominal pain, urinary urgency or frequency. New and nearly daily for weeks = evaluate.","chart":[{"tab":"Nurses' Notes","body":"59-year-old reports that for the past 5 weeks she has felt bloated nearly every day, gets full after a few bites, has vague lower abdominal pressure, and urinates more often with urgency. States, \"My pants are tighter, but I've been eating less.\" Menopause at age 51."}],"id":45},{"topic":"Ovarian Cancer","type":"sata","ncj":"Analyze Cues","stem":"Which factors increase a client's risk for ovarian cancer? <b>Select all that apply.<\/b>","o":[{"t":"Use of infertility drugs","c":true,"r":"Listed as a risk factor."},{"t":"Never having been pregnant","c":true,"r":"Nulliparity means more uninterrupted ovulation."},{"t":"History of endometriosis","c":true,"r":"Endometriosis is associated with higher risk."},{"t":"Taking combined oral contraceptives for 7 years","c":false,"r":"OCPs suppress ovulation and lower risk."},{"t":"Previous tubal ligation","c":false,"r":"Tubal ligation is associated with lower risk."},{"t":"BRCA1 mutation","c":true,"r":"BRCA1 and BRCA2 mutations greatly increase risk."},{"t":"Breastfeeding three children","c":false,"r":"Breastfeeding suppresses ovulation and is protective."}],"key":"Ovarian cancer risk: family history or BRCA, age, nulliparity, HRT, infertility drugs, early menarche, late menopause, endometriosis. Fewer ovulations (pregnancy, breastfeeding, OCPs) = protective.","chart":[],"id":46},{"topic":"Ovarian Cancer","type":"mc","ncj":"Analyze Cues","stem":"A client asks whether a CA-125 blood test can tell her if she has ovarian cancer. Which response by the nurse is accurate?","o":[{"t":"\"CA-125 is elevated in about 80% of ovarian cancers, but other conditions can raise it too, so it's used with a pelvic exam and ultrasound for women at high risk.\"","c":true,"r":"CA-125 is useful but nonspecific. It's paired with a pelvic exam and transvaginal ultrasound for high-risk women and used to monitor treatment."},{"t":"\"An elevated CA-125 confirms you have ovarian cancer.\"","c":false,"r":"Other cancers and benign conditions can raise CA-125. Tissue diagnosis is needed."},{"t":"\"A normal CA-125 rules out ovarian cancer.\"","c":false,"r":"About 20% of ovarian cancers don't raise CA-125."},{"t":"\"All women over 50 should have a yearly CA-125 test.\"","c":false,"r":"It isn't recommended as routine screening for average-risk women."}],"key":"CA-125: positive in about 80% of ovarian cancers but not specific. Used with pelvic exam and ultrasound in high-risk women and to monitor treatment.","chart":[],"id":47},{"topic":"Ovarian Cancer","type":"sata","ncj":"Take Action","stem":"Which actions should the nurse take? <b>Select all that apply.<\/b>","o":[{"t":"Offer three large meals a day to maintain nutrition","c":false,"r":"Early satiety calls for small, frequent meals."},{"t":"Weigh her daily","c":true,"r":"Daily weight reflects fluid shifts."},{"t":"Have her empty her bladder before the paracentesis","c":true,"r":"An empty bladder lowers the risk of puncturing it."},{"t":"Position her in semi-Fowler's or high Fowler's position","c":true,"r":"Upright positioning lets the diaphragm move more freely."},{"t":"Measure abdominal girth daily at the same marked spot","c":true,"r":"Consistent measurement tracks fluid buildup."},{"t":"Place her flat with legs elevated to help her breathing","c":false,"r":"Lying flat lets the fluid push on the diaphragm and worsens dyspnea."}],"key":"Ascites: upright position, daily girth and weight, small frequent meals, void before paracentesis.","chart":[{"tab":"Nurses' Notes","body":"Client with advanced ovarian cancer and ascites. Abdomen tense and distended. RR 26; reports shortness of breath and feeling full after a few bites. Paracentesis scheduled this afternoon."}],"id":48},{"topic":"Ovarian Cancer","type":"mc","ncj":"Take Action","stem":"A 35-year-old with a BRCA1 mutation whose mother died of ovarian cancer asks what she can do to lower her own risk. Which response by the nurse is most appropriate?","o":[{"t":"\"Your yearly Pap test will catch ovarian cancer early.\"","c":false,"r":"Pap tests screen for cervical cancer only."},{"t":"\"Avoid birth control pills because they raise ovarian cancer risk.\"","c":false,"r":"OCPs lower ovarian cancer risk."},{"t":"\"Talk with your HCP about having your ovaries and tubes removed once you're done having children. Until then, screening may include ultrasounds and CA-125 tests.\"","c":true,"r":"Prophylactic salpingo-oophorectomy greatly lowers risk in BRCA carriers. Until then, high-risk screening uses transvaginal ultrasound, CA-125, and pelvic exams."},{"t":"\"Nothing can be done until you have symptoms.\"","c":false,"r":"Risk reduction and surveillance options exist."}],"key":"BRCA carriers: discuss prophylactic BSO after childbearing. Use ultrasound and CA-125 surveillance until then.","chart":[],"id":49},{"topic":"Ovarian Cancer","type":"sata","ncj":"Recognize Cues","stem":"Which findings require follow-up? <b>Select all that apply.<\/b>","o":[{"t":"Urine output 45 mL/hr","c":false,"r":"Above the 30 mL/hr minimum."},{"t":"Swollen, warm, tender left calf","c":true,"r":"Suggests DVT. Pelvic cancer surgery carries a high VTE risk."},{"t":"BP 88/52 and HR 124","c":true,"r":"Hypotension with tachycardia suggests hemorrhage or hypovolemic shock."},{"t":"Small amount of serosanguineous drainage","c":false,"r":"Expected on postop day 2."},{"t":"Distended abdomen, absent bowel sounds, and vomiting","c":true,"r":"Suggests paralytic ileus or obstruction after extensive abdominal surgery."},{"t":"Pain 4/10 with PCA","c":false,"r":"Pain is being managed."}],"key":"After debulking surgery, watch for hemorrhage, ileus, and DVT.","chart":[{"tab":"Nurses' Notes","body":"Postop day 2 after TAH-BSO, omentectomy, and tumor debulking for ovarian cancer.<br>BP 88/52 (baseline 128/76). HR 124.<br>Abdomen distended, bowel sounds absent, vomited twice.<br>Left calf swollen, warm, and tender.<br>Pain 4/10 with PCA. Small amount of serosanguineous drainage on the dressing. Urine output 45 mL/hr."}],"id":50},{"topic":"Ovarian Cancer","type":"mc","ncj":"Analyze Cues","stem":"A client newly diagnosed with stage III ovarian cancer says, \"I thought I just had gas and indigestion for months.\" The nurse understands ovarian cancer is often diagnosed late because:","o":[{"t":"Early symptoms are vague and easily mistaken for GI or urinary problems, and there's no reliable screening test for average-risk women.","c":true,"r":"Vague symptoms and no effective general screening explain the late diagnosis. It's the 5th leading cause of cancer death in women."},{"t":"It only causes heavy vaginal bleeding after it has spread.","c":false,"r":"Bleeding is not the typical presentation."},{"t":"A Pap test only detects it in late stages.","c":false,"r":"A Pap test doesn't detect ovarian cancer at any stage."},{"t":"It grows slowly and rarely spreads beyond the ovary.","c":false,"r":"It often spreads through the peritoneum before symptoms are recognized."}],"key":"Ovarian cancer is found late because symptoms are vague and there's no screening test for average-risk women.","chart":[],"id":51},{"topic":"Cervical Cancer","type":"sata","ncj":"Analyze Cues","stem":"Which findings in a client's history increase her risk for cervical cancer? <b>Select all that apply.<\/b>","o":[{"t":"History of endometriosis","c":false,"r":"Endometriosis is linked to ovarian cancer, not cervical."},{"t":"Uses a copper intrauterine device (IUD)","c":false,"r":"An IUD is not a cervical cancer risk factor."},{"t":"Has taken oral contraceptives for 10 years","c":true,"r":"Long-term OCP use raises cervical cancer risk (even though it lowers ovarian and endometrial risk)."},{"t":"Has given birth to five children","c":true,"r":"Multiparity is a risk factor."},{"t":"Positive test for HPV type 16","c":true,"r":"High-risk HPV strains 16 and 18 cause most cervical cancers."},{"t":"Her mother took diethylstilbestrol (DES) while pregnant with her","c":true,"r":"DES exposure is a risk factor."},{"t":"Has never been pregnant","c":false,"r":"Nulliparity is a risk for endometrial and ovarian cancer, not cervical."}],"key":"Cervical cancer: HPV 16 and 18, long-term OCPs, DES exposure, multiparity, smoking.","chart":[],"id":52},{"topic":"Cervical Cancer","type":"mc","ncj":"Generate Solutions","stem":"A 34-year-old with normal cervical cancer screening in the past asks how often she needs to be screened. Which response by the nurse reflects the guidelines in the study guide?","o":[{"t":"\"A Pap test every 3 years and an HPV test every year.\"","c":false,"r":"Not a recommended schedule."},{"t":"\"A Pap test with HPV co-testing every 5 years.\"","c":true,"r":"Ages 30 to 65: Pap and HPV co-testing every 5 years."},{"t":"\"A Pap test every year.\"","c":false,"r":"Annual Pap testing is no longer recommended for average-risk women."},{"t":"\"You don't need screening since you got the HPV vaccine.\"","c":false,"r":"Vaccinated women still need screening."}],"key":"Cervical screening: 21 to 29, Pap every 3 years. 30 to 65, Pap plus HPV every 5 years.","chart":[],"id":53},{"topic":"Cervical Cancer","type":"sata","ncj":"Recognize Cues","stem":"Which findings would the nurse expect in a client with <b>advanced<\/b> cervical cancer? <b>Select all that apply.<\/b>","o":[{"t":"Fatigue and pallor from anemia","c":true,"r":"Ongoing blood loss leads to anemia, a late sign."},{"t":"No symptoms at all","c":false,"r":"Cervical cancer is often silent early, but advanced disease causes symptoms."},{"t":"Pelvic, back, or leg pain","c":true,"r":"Pain is a late symptom from tumor spread."},{"t":"Spotting that has become heavier and more frequent","c":true,"r":"Bleeding increases as the tumor grows."},{"t":"Bloating and early satiety as the main complaints","c":false,"r":"Those are classic ovarian cancer symptoms."},{"t":"Weight loss and cachexia","c":true,"r":"Late signs."},{"t":"Dark, foul-smelling vaginal discharge","c":true,"r":"Discharge starts thin and watery, then becomes dark and foul-smelling as the disease progresses."}],"key":"Cervical cancer: silent early, then abnormal bleeding and thin watery discharge, then dark foul discharge, pain, weight loss, anemia, cachexia.","chart":[],"id":54},{"topic":"Cervical Cancer","type":"sata","ncj":"Take Action","stem":"A client with cervical cancer has a sealed internal radiation implant (brachytherapy) in place. Which actions should the nurse take? <b>Select all that apply.<\/b>","o":[{"t":"If it falls out, pick it up with gloved hands and reinsert it","c":false,"r":"Never touch it, even with gloves. Use forceps, place it in the lead container, and notify the HCP and radiation safety."},{"t":"Let her grandchildren visit for 30 minutes","c":false,"r":"Children under 18 and pregnant visitors aren't allowed."},{"t":"Provide a low-residue diet","c":true,"r":"Fewer bowel movements lowers the chance of dislodging the implant."},{"t":"Assign her to a private room","c":true,"r":"Limits radiation exposure to others."},{"t":"Encourage her to walk in the hallway every 2 hours","c":false,"r":"She stays on bedrest with limited movement to keep the implant in place."},{"t":"Keep the indwelling urinary catheter in place","c":true,"r":"A drained bladder prevents displacement and limits bladder exposure."},{"t":"Keep long-handled forceps and a lead container in the room","c":true,"r":"If the implant comes out, it's picked up with forceps and placed in the lead container."}],"key":"Internal radiation implant: private room, bedrest, low-residue diet, catheter, limit time and keep distance, no children or pregnant visitors, forceps and lead container.","chart":[],"id":55},{"topic":"Cervical Cancer","type":"mc","ncj":"Take Action","stem":"A client is scheduled for a Pap test next week. Which instruction should the nurse give?","o":[{"t":"\"Douche the morning of the test to remove discharge.\"","c":false,"r":"Douching removes cells needed for the test."},{"t":"\"Schedule it during your heaviest menstrual flow.\"","c":false,"r":"Blood can obscure the sample. Schedule it when she's not menstruating."},{"t":"\"Don't eat or drink after midnight before the test.\"","c":false,"r":"No fasting is needed."},{"t":"\"For 24 to 48 hours before the test, avoid intercourse, douching, tampons, and vaginal creams or medications.\"","c":true,"r":"These can wash away or hide abnormal cells."}],"key":"Pap prep: no intercourse, douching, tampons, or vaginal products for 24 to 48 hours; schedule when not menstruating.","chart":[],"id":56},{"topic":"Cervical Cancer","type":"sata","ncj":"Generate Solutions","stem":"A parent asks the nurse about the HPV vaccine for their 11-year-old twins, a boy and a girl. Which statements by the nurse are accurate? <b>Select all that apply.<\/b>","o":[{"t":"\"One dose protects for life at any age.\"","c":false,"r":"It's a multi-dose series. The number of doses depends on age at the start."},{"t":"\"It's recommended for both boys and girls at age 11 to 12.\"","c":true,"r":"HPV vaccination is recommended for males and females at 11 to 12."},{"t":"\"Only girls need it because boys can't get HPV-related cancers.\"","c":false,"r":"Males get HPV-related cancers and spread HPV, so both sexes are vaccinated."},{"t":"\"Your daughter will still need regular cervical cancer screening as an adult.\"","c":true,"r":"The vaccine doesn't cover every high-risk strain."},{"t":"\"It protects against high-risk HPV strains, including types 16 and 18.\"","c":true,"r":"These strains cause most cervical cancers."},{"t":"\"It treats existing HPV infections and abnormal Pap results.\"","c":false,"r":"It prevents infection. It doesn't treat it."}],"key":"HPV vaccine: boys and girls at 11 to 12, prevents (doesn't treat) high-risk HPV, and screening still continues.","chart":[],"id":57},{"topic":"Cervical Cancer","type":"mc","ncj":"Prioritize Hypotheses","stem":"The nurse at a women's health clinic is returning calls. Which client should the nurse follow up with <b>first<\/b>?","o":[{"t":"A 31-year-old with a normal Pap and HPV co-test 2 years ago who asks when her next one is due","c":false,"r":"Routine question. Her next co-test is due in about 3 years."},{"t":"A 45-year-old who had a total hysterectomy for fibroids and asks whether she still needs Pap tests","c":false,"r":"Routine question. Screening generally isn't needed after total hysterectomy for benign reasons."},{"t":"A 27-year-old who reports bleeding after intercourse and a thin, watery vaginal discharge","c":true,"r":"Abnormal bleeding and thin, watery discharge can be early signs of cervical cancer and need evaluation."},{"t":"A 66-year-old with a history of normal screening who asks why she no longer needs Pap tests","c":false,"r":"Routine education. Screening can stop after 65 with adequate negative history."}],"key":"Postcoital bleeding plus watery discharge = possible cervical cancer. Evaluate promptly.","chart":[],"id":58},{"topic":"BPH","type":"sata","ncj":"Recognize Cues","stem":"A 67-year-old with BPH describes his urinary symptoms. Which symptoms are classified as <b>obstructive<\/b>? <b>Select all that apply.<\/b>","o":[{"t":"Nocturia","c":false,"r":"Nocturia is an irritative symptom, often the first one men notice."},{"t":"Bladder pain","c":false,"r":"Irritative symptom."},{"t":"Dysuria","c":false,"r":"Irritative symptom."},{"t":"Starting and stopping the stream several times while voiding","c":true,"r":"Intermittency is obstructive, caused by the enlarged prostate narrowing the urethra."},{"t":"Decreased force of the urinary stream","c":true,"r":"Obstructive: the narrowed urethra reduces the caliber and force of the stream."},{"t":"Urgency","c":false,"r":"Irritative symptom from bladder inflammation or overactivity."}],"key":"Obstructive: weak stream, hesitancy, intermittency, dribbling. Irritative: nocturia (often first), frequency, urgency, dysuria, bladder pain, incontinence.","chart":[],"id":59},{"topic":"BPH","type":"mc","ncj":"Take Action","stem":"A client with BPH asks which over-the-counter product he can use for a head cold. Which product is the <b>safest<\/b> choice?","o":[{"t":"Diphenhydramine at bedtime","c":false,"r":"Anticholinergic effects reduce bladder contraction and can cause retention."},{"t":"Pseudoephedrine tablets","c":false,"r":"Alpha-adrenergic agonists contract prostate and bladder neck smooth muscle and can cause acute urinary retention."},{"t":"Phenylephrine decongestant","c":false,"r":"Same alpha-agonist effect as pseudoephedrine."},{"t":"Saline nasal spray","c":true,"r":"Saline doesn't affect the bladder or prostate."}],"key":"BPH: avoid decongestants (pseudoephedrine, phenylephrine) and anticholinergics. They can trigger acute urinary retention.","chart":[],"id":60},{"topic":"BPH","type":"sata","ncj":"Take Action","stem":"A client with mild BPH is on active surveillance (watchful waiting). Which instructions should the nurse include? <b>Select all that apply.<\/b>","o":[{"t":"Drink a large amount of fluid quickly to flush out your bladder","c":false,"r":"Rapid filling can overdistend the bladder and cause retention."},{"t":"Void every 2 to 3 hours and as soon as you feel the urge","c":true,"r":"Prevents overdistention and retention."},{"t":"Keep up with annual PSA and digital rectal exam checks","c":true,"r":"Active surveillance includes a yearly PSA and DRE."},{"t":"Limit alcohol and caffeine, especially in the evening","c":true,"r":"Their diuretic effect distends the bladder and makes it overactive."},{"t":"Drink a normal amount of fluid during the day, but limit fluids before bedtime","c":true,"r":"Restricting fluids too much concentrates urine and raises UTI risk. Cutting back in the evening helps nocturia."},{"t":"Hold your urine as long as possible to stretch your bladder","c":false,"r":"Holding urine causes overdistention and retention."},{"t":"Report it if your symptoms change so your symptom score can be repeated","c":true,"r":"The AUA symptom score and postvoid residual are repeated when symptoms change."}],"key":"Watchful waiting: avoid alcohol, caffeine, and decongestants; void every 2 to 3 hours and at first urge; normal fluids; yearly PSA and DRE.","chart":[],"id":61},{"topic":"BPH","type":"sata","ncj":"Take Action","stem":"A client with BPH is starting finasteride. Which information should the nurse include in the teaching? <b>Select all that apply.<\/b>","o":[{"t":"\"It may lower your sex drive or cause erectile problems.\"","c":true,"r":"Decreased libido, ED, and lower ejaculate volume are common."},{"t":"\"Take it at bedtime because it can make your blood pressure drop when you stand.\"","c":false,"r":"That describes alpha blockers such as tamsulosin."},{"t":"\"It works within a few days by relaxing the muscle around your urethra.\"","c":false,"r":"That also describes alpha blockers. Finasteride shrinks the gland."},{"t":"\"This drug lowers your PSA, so tell anyone who checks your PSA that you take it.\"","c":true,"r":"Finasteride lowers PSA by about half, which can hide prostate cancer if it isn't accounted for."},{"t":"\"You can stop taking it once your stream improves.\"","c":false,"r":"Benefits fade when the drug is stopped."},{"t":"\"Women who are or could become pregnant shouldn't handle crushed or broken tablets.\"","c":true,"r":"It can harm a male fetus's genital development."},{"t":"\"It can take 3 to 6 months or more before you notice improvement.\"","c":true,"r":"5-alpha-reductase inhibitors shrink the prostate slowly."}],"key":"Finasteride/dutasteride: slow (months), sexual side effects, lowers PSA, pregnant women shouldn't handle it. Alpha blockers: fast, orthostatic hypotension.","chart":[],"id":62},{"topic":"BPH","type":"mc","ncj":"Take Action","stem":"A client with BPH is starting tamsulosin. Which instruction is the <b>priority<\/b>?","o":[{"t":"\"Take it with a decongestant to help with nasal stuffiness.\"","c":false,"r":"Decongestants worsen urinary retention."},{"t":"\"Pregnant women shouldn't handle your tablets.\"","c":false,"r":"That precaution applies to finasteride and dutasteride."},{"t":"\"Get up slowly from lying or sitting, especially at night, because this drug can make you dizzy or faint.\"","c":true,"r":"Alpha blockers cause orthostatic hypotension. Falls are the biggest safety risk, especially on nighttime bathroom trips."},{"t":"\"You won't see the full effect for about 6 months.\"","c":false,"r":"Tamsulosin works within days to weeks. Six months describes 5-alpha-reductase inhibitors."}],"key":"Alpha blockers: orthostatic hypotension and fall risk. Also tell the eye surgeon before cataract surgery (floppy iris syndrome).","chart":[],"id":63},{"topic":"BPH","type":"sata","ncj":"Recognize Cues","stem":"Which findings require <b>immediate<\/b> follow-up? <b>Select all that apply.<\/b>","o":[{"t":"Bright red urine with clots and thick consistency","c":true,"r":"Suggests arterial bleeding. Notify the HCP."},{"t":"Catheter taped to the thigh with traction","c":false,"r":"Traction helps control bleeding at the surgical site."},{"t":"Light pink urine without clots at 1500","c":false,"r":"Expected early after TURP."},{"t":"New confusion with a sodium of 124 mEq/L","c":true,"r":"Dilutional hyponatremia from absorbed irrigating fluid during surgery (TURP syndrome)."},{"t":"Decreasing drainage with suprapubic distention","c":true,"r":"Clots are likely blocking the catheter. The bladder is overdistending, which worsens bleeding and spasms."},{"t":"Temperature 99.1&deg;F","c":false,"r":"A low-grade temperature this early after surgery isn't concerning."}],"key":"After TURP: bright red urine with clots (arterial bleed), poor drainage with distention (clot obstruction), and confusion with low sodium (TURP syndrome) need action.","chart":[{"tab":"Nurses' Notes","body":"6 hours after transurethral resection of the prostate (TURP). Three-way catheter with continuous bladder irrigation (CBI) infusing. Catheter taped to the thigh with traction.<br>1500: urine light pink, no clots.<br>1700: urine bright red with clots and thick consistency. Catheter drainage decreasing. Suprapubic area distended. Client is newly confused and asks, \"Where am I?\"<br>T 99.1&deg;F (37.3&deg;C)."},{"tab":"Lab Results","body":"Serum sodium: 124 mEq/L (preop 139 mEq/L)"}],"id":64},{"topic":"BPH","type":"mc","ncj":"Take Action","stem":"What is the client's <b>true urine output<\/b> for the shift?","o":[{"t":"6,850 mL","c":false,"r":"This adds the irrigant instead of subtracting it."},{"t":"3,850 mL","c":false,"r":"This counts the irrigant as urine."},{"t":"3,000 mL","c":false,"r":"This is only the irrigant volume."},{"t":"850 mL","c":true,"r":"True urine output = total drainage minus irrigant infused: 3,850 minus 3,000 = 850 mL."}],"key":"CBI true urine output = drainage total minus irrigant infused.","chart":[{"tab":"Intake & Output","body":"Continuous bladder irrigation, 0700 to 1500.<br>Irrigant infused: 3,000 mL<br>Total emptied from drainage bag: 3,850 mL"}],"id":65},{"topic":"BPH","type":"mc","ncj":"Take Action","stem":"Two hours after a TURP, a client with continuous bladder irrigation reports severe bladder spasms. Over the last 30 minutes, very little has drained into the bag, and his suprapubic area is distended. The tubing has no kinks. Which action should the nurse take <b>first<\/b>?","o":[{"t":"Stop the CBI inflow and manually irrigate the catheter with sterile saline as prescribed","c":true,"r":"The catheter is likely blocked by clots. Stop adding fluid, clear the clot by manual irrigation, and notify the HCP if it won't clear."},{"t":"Increase the CBI flow rate to flush out the clots","c":false,"r":"More inflow into a blocked bladder causes overdistention, pain, and more bleeding."},{"t":"Remove the three-way catheter and insert a new one","c":false,"r":"The nurse never removes a post-TURP catheter without an HCP order. It helps control bleeding."},{"t":"Give the prescribed antispasmodic and reassess in 1 hour","c":false,"r":"The spasms come from distention. Medication doesn't fix the blockage."}],"key":"CBI not draining + distention: stop the inflow, manually irrigate per order, and notify the HCP if it doesn't clear. Never speed up the inflow.","chart":[],"id":66},{"topic":"BPH","type":"sata","ncj":"Take Action","stem":"The nurse is preparing a client for discharge after a TURP. Which instructions should be included? <b>Select all that apply.<\/b>","o":[{"t":"Take aspirin for any discomfort","c":false,"r":"Aspirin increases bleeding risk."},{"t":"Drink 2 to 3 L of fluid a day","c":true,"r":"Keeps urine flowing and clots from forming."},{"t":"Semen may go into your bladder (retrograde ejaculation), and that isn't harmful","c":true,"r":"A common, expected effect after TURP. It can make urine cloudy."},{"t":"Avoid heavy lifting and straining at stool for several weeks","c":true,"r":"Straining increases pressure on the healing prostatic area and can cause bleeding."},{"t":"Bright red urine with clots is normal for 6 weeks","c":false,"r":"Increased bleeding or clots should be reported."},{"t":"It may take up to 2 months for your bladder to return to normal, so use timed voiding","c":true,"r":"Bladder capacity recovers gradually."},{"t":"Dribbling may happen at first, and Kegel exercises can help","c":true,"r":"Temporary incontinence is common and improves with pelvic floor exercises."}],"key":"Post-TURP discharge: 2 to 3 L fluids, no straining or heavy lifting, timed voiding, Kegels, retrograde ejaculation is expected, report bleeding, clots, fever, or decreased stream.","chart":[],"id":67},{"topic":"BPH","type":"sata","ncj":"Analyze Cues","stem":"Which findings are risk factors for BPH? <b>Select all that apply.<\/b>","o":[{"t":"Smokes 1/2 pack per day","c":true,"r":"Smoking is a risk factor."},{"t":"Waist circumference of 44 inches","c":true,"r":"Obesity, especially a larger waist, is a risk factor."},{"t":"Type 2 diabetes","c":true,"r":"Diabetes is a risk factor."},{"t":"No regular exercise","c":true,"r":"Lack of physical activity is a risk factor."},{"t":"High-fiber diet","c":false,"r":"Not a risk factor."},{"t":"Vasectomy at age 38","c":false,"r":"Not a risk factor."},{"t":"Father had BPH surgery","c":true,"r":"A first-degree relative with BPH is a risk factor."}],"key":"BPH risk: aging, obesity (waist), inactivity, alcohol, ED, smoking, diabetes, first-degree relative.","chart":[{"tab":"Health History","body":"62-year-old. Waist circumference 44 in (112 cm).<br>Desk job, no regular exercise. Type 2 diabetes. Smokes 1/2 pack/day.<br>Father had prostate surgery for BPH.<br>Vasectomy at age 38. Eats a high-fiber diet."}],"id":68},{"topic":"BPH","type":"sata","ncj":"Prioritize Hypotheses","stem":"The nurse is reviewing assessment findings for several clients with BPH. Which findings indicate a <b>complication<\/b> that needs prompt intervention? <b>Select all that apply.<\/b>","o":[{"t":"Postvoid residual of 40 mL","c":false,"r":"A small residual isn't significant."},{"t":"Serum creatinine up from 0.9 to 2.1 mg/dL over a month","c":true,"r":"Suggests back pressure on the kidneys (hydronephrosis) and declining kidney function."},{"t":"Bladder scan shows 850 mL; client can't void and has suprapubic distention","c":true,"r":"Acute urinary retention."},{"t":"Reports a weaker stream than a year ago","c":false,"r":"An expected obstructive symptom."},{"t":"Temperature 101.8&deg;F (38.8&deg;C) with flank pain and chills","c":true,"r":"Suggests pyelonephritis, which can progress to sepsis."},{"t":"Gets up to urinate twice a night","c":false,"r":"Nocturia is a typical BPH symptom, not a complication."}],"key":"BPH complications: acute retention, UTI, pyelonephritis, sepsis, bladder stones, kidney damage.","chart":[],"id":69},{"topic":"BPH","type":"mc","ncj":"Evaluate Outcomes","stem":"The nurse is evaluating a client receiving continuous bladder irrigation after a TURP. Which finding indicates the irrigation is working as intended?","o":[{"t":"Light pink urine without clots","c":true,"r":"The goal is light pink to clear urine without clots. The rate is adjusted to keep it that way."},{"t":"Frequent bladder spasms with a firm lower abdomen","c":false,"r":"Suggests a clot blocking the catheter and distending the bladder."},{"t":"Dark red urine with small clots","c":false,"r":"The flow is too slow, or bleeding is increasing."},{"t":"Drainage volume less than the irrigant infused","c":false,"r":"Fluid is being retained, which suggests obstruction."}],"key":"CBI goal: light pink to clear urine without clots, and output greater than irrigant in.","chart":[],"id":70},{"topic":"Prostate Cancer","type":"sata","ncj":"Analyze Cues","stem":"Which findings increase this client's risk for prostate cancer? <b>Select all that apply.<\/b>","o":[{"t":"Father diagnosed at 58","c":true,"r":"A first-degree relative diagnosed before 65 raises risk."},{"t":"BPH diagnosis","c":false,"r":"BPH doesn't turn into prostate cancer, though both can coexist and cause similar symptoms."},{"t":"Vasectomy","c":false,"r":"Not a risk factor."},{"t":"Age 64","c":true,"r":"Incidence rises sharply after 50. Median age at diagnosis is 66."},{"t":"Diet high in red and processed meat and high-fat dairy, low in fruits and vegetables","c":true,"r":"Dietary risk factors."},{"t":"BMI 34","c":true,"r":"Obesity is a risk factor."},{"t":"Long-term pesticide exposure","c":true,"r":"Chemical pesticides are an environmental risk factor."},{"t":"Black race","c":true,"r":"Black men have a higher incidence and are a high-risk group for screening."}],"key":"Prostate cancer risk: age over 50, Black race, family history, high red meat and high-fat dairy diet, low produce, obesity, pesticides.","chart":[{"tab":"Health History","body":"64-year-old Black man. Farmer for 40 years with regular pesticide use.<br>Father diagnosed with prostate cancer at age 58.<br>Diet high in red and processed meat and whole-milk dairy; rarely eats fruits or vegetables. BMI 34.<br>Diagnosed with BPH 6 years ago. Vasectomy at age 35."}],"id":71},{"topic":"Prostate Cancer","type":"mc","ncj":"Generate Solutions","stem":"A 41-year-old with no symptoms tells the nurse his father was diagnosed with prostate cancer at 54 and his brother at 52. According to the American Cancer Society, when should he begin discussing prostate cancer screening with his HCP?","o":[{"t":"At age 50","c":false,"r":"Age 50 applies to average-risk men expected to live at least 10 more years."},{"t":"At age 45","c":false,"r":"Age 45 applies to high risk: Black men, or one first-degree relative diagnosed before 65."},{"t":"Now","c":true,"r":"More than one first-degree relative diagnosed at an early age puts him in the highest-risk group, where the discussion starts at age 40."},{"t":"At age 55","c":false,"r":"55 to 69 is the AUA range for shared decision-making in average-risk men."}],"key":"ACS screening discussion: 50 average risk, 45 high risk (Black or one first-degree relative under 65), 40 highest risk (more than one first-degree relative at an early age).","chart":[],"id":72},{"topic":"Prostate Cancer","type":"sata","ncj":"Analyze Cues","stem":"Which statements about prostate-specific antigen (PSA) and prostate cancer diagnosis are accurate? <b>Select all that apply.<\/b>","o":[{"t":"On DRE, prostate cancer usually feels smooth, soft, and symmetric.","c":false,"r":"Cancer feels hard, nodular, and asymmetric. BPH feels smooth, firm, and symmetrically enlarged."},{"t":"BPH and prostatitis can raise PSA.","c":true,"r":"PSA is prostate-specific, not cancer-specific."},{"t":"PSA alone can reliably tell BPH apart from prostate cancer.","c":false,"r":"Both raise PSA. A biopsy is usually indicated when PSA stays elevated or the DRE is abnormal."},{"t":"An elevated PSA confirms prostate cancer.","c":false,"r":"Only biopsy confirms it."},{"t":"A rising PSA after treatment can signal recurrence.","c":true,"r":"PSA is used to monitor treatment success and recurrence."},{"t":"PSA should become undetectable after a successful radical prostatectomy.","c":true,"r":"No prostate tissue means no PSA source."}],"key":"PSA is prostate-specific, not cancer-specific. Biopsy confirms. After treatment, PSA tracks success and recurrence.","chart":[],"id":73},{"topic":"Prostate Cancer","type":"sata","ncj":"Take Action","stem":"A client is being discharged after a radical prostatectomy with an indwelling urinary catheter. Which instructions should the nurse include? <b>Select all that apply.<\/b>","o":[{"t":"You can start heavy lifting as soon as the catheter is removed","c":false,"r":"Heavy lifting is restricted for several weeks after surgery."},{"t":"Erectile dysfunction is possible, and treatment options are available","c":true,"r":"ED is a major complication. Addressing it openly helps the client cope."},{"t":"Avoid straining with bowel movements, and use a stool softener","c":true,"r":"Straining stresses the surgical site."},{"t":"Leaking urine after the catheter comes out means the surgery failed","c":false,"r":"Incontinence is common and usually improves over months."},{"t":"Do Kegel exercises to help regain urinary control","c":true,"r":"Urinary incontinence is common after the catheter comes out, and pelvic floor exercises speed recovery."},{"t":"Keep the drainage bag below the bladder and clean around the catheter daily","c":true,"r":"Prevents backflow and infection."}],"key":"After radical prostatectomy: catheter care, Kegels for incontinence, discuss ED openly, no straining or heavy lifting.","chart":[],"id":74},{"topic":"Prostate Cancer","type":"sata","ncj":"Take Action","stem":"A client with advanced prostate cancer is starting leuprolide (androgen deprivation therapy). Which adverse effects should the nurse teach the client about? <b>Select all that apply.<\/b>","o":[{"t":"Increased sex drive","c":false,"r":"Libido decreases."},{"t":"A temporary flare of bone pain or urinary symptoms when therapy starts","c":true,"r":"LHRH agonists briefly increase testosterone before suppressing it (tumor flare)."},{"t":"Hot flashes","c":true,"r":"Dropping testosterone causes vasomotor symptoms."},{"t":"Bone loss (osteoporosis)","c":true,"r":"Bone density monitoring, calcium, vitamin D, and weight-bearing exercise are recommended."},{"t":"Increased muscle mass","c":false,"r":"Androgen deprivation causes loss of muscle mass."},{"t":"Decreased libido and erectile dysfunction","c":true,"r":"Expected with androgen deprivation."},{"t":"Low blood sugar (hypoglycemia)","c":false,"r":"ADT tends to cause insulin resistance and higher blood glucose (metabolic syndrome), not hypoglycemia."}],"key":"ADT effects: hot flashes, low libido and ED, gynecomastia, bone loss, muscle loss, and an initial tumor flare.","chart":[],"id":75},{"topic":"Prostate Cancer","type":"mc","ncj":"Prioritize Hypotheses","stem":"Which condition should the nurse suspect is developing?","o":[{"t":"Worsening BPH","c":false,"r":"BPH can cause retention but not back pain with leg weakness."},{"t":"Lumbar muscle strain","c":false,"r":"A strain doesn't cause bilateral weakness and retention."},{"t":"Spinal cord compression","c":true,"r":"Back pain worse lying down, new bilateral leg weakness, and urinary retention in a client with bone metastases signal spinal cord compression. It's an oncologic emergency; notify the HCP immediately to prevent permanent paralysis."},{"t":"An expected effect of androgen deprivation therapy","c":false,"r":"ADT doesn't cause new neurologic deficits."}],"key":"Bone metastasis + back pain + leg weakness + bladder changes = spinal cord compression. Emergency.","chart":[{"tab":"Nurses' Notes","body":"65-year-old with prostate cancer metastatic to bone. Low back pain for 2 weeks, now worse when lying down. Since this morning, both legs feel weak and 'heavy,' and he hasn't been able to urinate.<br>Bladder scan: 700 mL."}],"id":76},{"topic":"Prostate Cancer","type":"sata","ncj":"Take Action","stem":"A client had permanent radioactive seed implants (brachytherapy) placed for prostate cancer. Which discharge instructions should the nurse include? <b>Select all that apply.<\/b>","o":[{"t":"Urinary frequency, urgency, and burning are common after the procedure","c":true,"r":"Radiation irritates the bladder and urethra."},{"t":"You'll be radioactive for life, so you must sleep alone permanently","c":false,"r":"Seed radioactivity decays over weeks to months. Precautions are time-limited."},{"t":"Use a condom during sexual activity for the first few weeks","c":true,"r":"A seed can occasionally pass in semen."},{"t":"No precautions are needed because the seeds are inside the prostate","c":false,"r":"Temporary precautions are needed."},{"t":"If a seed passes in your urine, don't touch it with your fingers; pick it up with a spoon or tweezers and follow the disposal instructions you were given","c":true,"r":"Seeds are handled without direct contact."},{"t":"Avoid close contact with pregnant women, and don't hold small children on your lap for the period your HCP specifies","c":true,"r":"Radiation is emitted at low levels for a while after placement."}],"key":"Prostate seed implants: temporary distance from pregnant women and children, don't touch passed seeds, condoms at first, expect urinary irritation.","chart":[],"id":77},{"topic":"Prostate Cancer","type":"mc","ncj":"Analyze Cues","stem":"A client asks what his Gleason score means. Which explanation by the nurse is accurate?","o":[{"t":"\"The two most common cell patterns in your tumor are each graded from 1 to 5 and added together. A higher score means a more aggressive cancer.\"","c":true,"r":"1 = well differentiated (lowest grade); 5 = poorly differentiated (highest grade). The two most common patterns are added."},{"t":"\"It counts how many lymph nodes contain cancer.\"","c":false,"r":"That's part of staging, not Gleason grading."},{"t":"\"It's another name for your PSA level.\"","c":false,"r":"Gleason grading is based on tissue from biopsy, not blood."},{"t":"\"A lower score means the cancer is more aggressive.\"","c":false,"r":"It's the reverse. Higher scores are more aggressive."}],"key":"Gleason: two most common patterns, each graded 1 to 5, added together. Higher = poorly differentiated = more aggressive.","chart":[],"id":78},{"topic":"Testicular Cancer","type":"sata","ncj":"Recognize Cues","stem":"A 27-year-old reports a 'heavy feeling' in his scrotum. Which findings are consistent with testicular cancer? <b>Select all that apply.<\/b>","o":[{"t":"A dull ache in the lower abdomen or groin","c":true,"r":"A common complaint."},{"t":"A firm, nontender scrotal mass","c":true,"r":"Typical exam finding."},{"t":"Scrotal swelling","c":true,"r":"Swelling and heaviness are common."},{"t":"A painless lump in the testicle","c":true,"r":"The most common presentation."},{"t":"A soft scrotal mass that lights up when a penlight shines through it","c":false,"r":"Transillumination suggests fluid, such as a hydrocele. Solid tumors don't transilluminate."},{"t":"Sudden severe testicular pain with nausea and no cremasteric reflex","c":false,"r":"This suggests testicular torsion, a surgical emergency."}],"key":"Testicular cancer: painless, firm, nontender lump, heaviness, dull ache. Only about 10% present with acute pain.","chart":[],"id":79},{"topic":"Testicular Cancer","type":"sata","ncj":"Analyze Cues","stem":"Which factors increase a client's risk for testicular cancer? <b>Select all that apply.<\/b>","o":[{"t":"Had a vasectomy","c":false,"r":"Not a risk factor."},{"t":"Brother had testicular cancer","c":true,"r":"Family history is a risk factor."},{"t":"Undescended testicle that was surgically corrected at age 2","c":true,"r":"Cryptorchidism raises risk even after surgical correction."},{"t":"Previous cancer in the other testicle","c":true,"r":"Raises risk in the remaining testis."},{"t":"Age 68","c":false,"r":"Testicular cancer is most common between 15 and 44, with a median age of 33."},{"t":"HIV infection","c":true,"r":"Listed risk factor."},{"t":"Rides a bicycle to work every day","c":false,"r":"Cycling is not a testicular cancer risk factor."}],"key":"Testicular cancer risk: cryptorchidism, family history, HIV, orchitis, maternal estrogen exposure, prior cancer in the other testis. Ages 15 to 44.","chart":[],"id":80},{"topic":"Testicular Cancer","type":"mc","ncj":"Take Action","stem":"A 24-year-old with testicular cancer is scheduled for a radical inguinal orchiectomy followed by chemotherapy. He mentions he and his partner hope to have children someday. Which action by the nurse is the <b>priority<\/b>?","o":[{"t":"Teach testicular self-exam for the remaining testicle","c":false,"r":"Important later, but fertility preservation must happen before treatment."},{"t":"Tell him adoption may be his only option","c":false,"r":"Premature and discouraging. Fertility preservation is available."},{"t":"Reassure him that chemotherapy doesn't affect fertility","c":false,"r":"Chemotherapy can cause temporary or permanent infertility."},{"t":"Discuss sperm banking before surgery and chemotherapy begin","c":true,"r":"Treatment can impair fertility, and sperm must be banked before it starts. It's time-sensitive."}],"key":"Testicular cancer in young men: offer sperm banking before treatment.","chart":[],"id":81},{"topic":"Testicular Cancer","type":"sata","ncj":"Generate Solutions","stem":"A client has a firm scrotal mass, and testicular cancer is suspected. Which diagnostic studies should the nurse anticipate? <b>Select all that apply.<\/b>","o":[{"t":"Serum lactate dehydrogenase (LDH)","c":true,"r":"Tumor marker."},{"t":"Serum human chorionic gonadotropin (hCG)","c":true,"r":"Tumor marker."},{"t":"CA-125 level","c":false,"r":"CA-125 is used for ovarian cancer."},{"t":"PSA level","c":false,"r":"PSA is for prostate disease."},{"t":"Scrotal ultrasound","c":true,"r":"First imaging study for a scrotal mass."},{"t":"Chest x-ray","c":true,"r":"Checks for lung metastasis."},{"t":"CT of the abdomen and pelvis","c":true,"r":"Used for staging and finding metastasis."},{"t":"Serum alpha-fetoprotein (AFP)","c":true,"r":"Tumor marker."}],"key":"Testicular cancer workup: ultrasound; markers AFP, hCG, LDH; CT abdomen/pelvis and chest x-ray for staging.","chart":[],"id":82},{"topic":"Testicular Cancer","type":"sata","ncj":"Take Action","stem":"The nurse is teaching testicular self-examination (TSE) to a group of college athletes. Which instructions should be included? <b>Select all that apply.<\/b>","o":[{"t":"Do the exam once a month","c":true,"r":"Monthly TSE helps men learn what's normal and spot changes early."},{"t":"Do it during or after a warm bath or shower","c":true,"r":"Warmth relaxes the scrotum, making the testes easier to feel."},{"t":"Do the exam once a year","c":false,"r":"Monthly is recommended."},{"t":"Start doing self-exams at age 40","c":false,"r":"Testicular cancer is most common between 15 and 44, so self-exams start in the teen years."},{"t":"The soft, cord-like structure at the back of the testicle is normal","c":true,"r":"That's the epididymis. Knowing this prevents false alarms."},{"t":"Gently roll each testicle between your thumb and fingers","c":true,"r":"Correct technique."},{"t":"If one testicle is slightly larger than the other, see an HCP immediately","c":false,"r":"Slight asymmetry is normal. A new lump, swelling, or heaviness is what to report."}],"key":"TSE: monthly, after a warm shower, roll each testis, the epididymis is normal, report lumps, swelling, or heaviness.","chart":[],"id":83},{"topic":"Testicular Cancer","type":"mc","ncj":"Evaluate Outcomes","stem":"After a radical inguinal orchiectomy for early-stage testicular cancer, a client asks about his outlook. Which statement by the nurse is accurate?","o":[{"t":"\"You'll need testosterone replacement for the rest of your life.\"","c":false,"r":"One healthy testis usually keeps testosterone levels normal."},{"t":"\"Every stage of testicular cancer requires chemotherapy after surgery.\"","c":false,"r":"Early stage may need only surveillance."},{"t":"\"Testicular cancer is one of the most curable cancers, especially when found early, and the remaining testicle usually makes enough testosterone.\"","c":true,"r":"About 95% achieve complete remission when it's caught early. Early stage may need no further treatment beyond surveillance."},{"t":"\"Since the cancer was removed, you won't need any follow-up.\"","c":false,"r":"Surveillance (tumor markers and imaging) is essential."}],"key":"Testicular cancer: highly curable (about 95% remission early). Orchiectomy, then surveillance, radiation, or chemo depending on stage.","chart":[],"id":84},{"topic":"Erectile Dysfunction","type":"mc","ncj":"Take Action","stem":"A client with coronary artery disease who takes isosorbide mononitrate daily asks the nurse about getting a prescription for sildenafil. Which response is the <b>priority<\/b>?","o":[{"t":"\"Use your nitroglycerin spray if you get chest pain after taking sildenafil.\"","c":false,"r":"Nitroglycerin after a PDE5 inhibitor can cause profound hypotension. He should get emergency care and tell responders he took it."},{"t":"\"Sildenafil can't be taken with nitrates because together they can cause a dangerous drop in blood pressure. Let's talk with your HCP about other options.\"","c":true,"r":"PDE5 inhibitors with nitrates can cause severe, life-threatening hypotension."},{"t":"\"Sildenafil is safe as long as you don't take more than one dose a day.\"","c":false,"r":"Ignores the dangerous interaction."},{"t":"\"Take the sildenafil at least 1 hour after your isosorbide.\"","c":false,"r":"Spacing doses doesn't make the combination safe."}],"key":"PDE5 inhibitors + any nitrate = severe hypotension. Absolute contraindication.","chart":[],"id":85},{"topic":"Erectile Dysfunction","type":"sata","ncj":"Take Action","stem":"A client is prescribed sildenafil for erectile dysfunction. Which instructions should the nurse include? <b>Select all that apply.<\/b>","o":[{"t":"Stop the drug and get help right away for sudden vision or hearing loss","c":true,"r":"Rare but serious adverse effects."},{"t":"Take it about 1 hour before sexual activity","c":true,"r":"Onset is about 30 to 60 minutes."},{"t":"Take it with a high-fat meal so it works faster","c":false,"r":"High-fat meals delay absorption."},{"t":"Headache, flushing, and nasal congestion are common side effects","c":true,"r":"Expected from vasodilation."},{"t":"If the first dose doesn't work, take a second dose an hour later","c":false,"r":"Maximum is one dose per day."},{"t":"Sexual stimulation is still needed to get an erection","c":true,"r":"PDE5 inhibitors improve blood flow but don't cause an erection on their own."},{"t":"Get emergency care for an erection that lasts more than 4 hours","c":true,"r":"Priapism can permanently damage penile tissue."}],"key":"PDE5 inhibitors: about 1 hour before, needs stimulation, once a day max, never with nitrates, report priapism over 4 hours or sudden vision or hearing loss.","chart":[],"id":86},{"topic":"Erectile Dysfunction","type":"sata","ncj":"Analyze Cues","stem":"A 58-year-old reports new erectile dysfunction. Which medications on his list may be contributing? <b>Select all that apply.<\/b>","o":[{"t":"Sertraline","c":true,"r":"SSRIs commonly cause sexual dysfunction."},{"t":"Calcium carbonate","c":false,"r":"Not associated with ED."},{"t":"Metoprolol","c":true,"r":"Beta blockers are a well-known cause of ED."},{"t":"Acetaminophen","c":false,"r":"Not associated with ED."},{"t":"Docusate","c":false,"r":"Not associated with ED."},{"t":"Hydrochlorothiazide","c":true,"r":"Thiazide diuretics are associated with ED."},{"t":"Finasteride","c":true,"r":"5-alpha-reductase inhibitors can cause ED and decreased libido."}],"key":"Common drug causes of ED: antihypertensives (beta blockers, thiazides), antidepressants (SSRIs), 5-alpha-reductase inhibitors.","chart":[{"tab":"Medication List","body":"Metoprolol 50 mg PO twice daily<br>Hydrochlorothiazide 25 mg PO daily<br>Sertraline 100 mg PO daily<br>Finasteride 5 mg PO daily<br>Acetaminophen 650 mg PO every 6 hr as needed<br>Docusate 100 mg PO daily<br>Calcium carbonate 500 mg PO daily"}],"id":87},{"topic":"Erectile Dysfunction","type":"sata","ncj":"Generate Solutions","stem":"A 52-year-old is being evaluated for erectile dysfunction. Which diagnostic tests should the nurse anticipate? <b>Select all that apply.<\/b>","o":[{"t":"Nocturnal penile tumescence and rigidity testing","c":true,"r":"Shows whether erections occur during sleep."},{"t":"Testosterone, prolactin, and LH levels","c":true,"r":"Hormone levels identify endocrine causes."},{"t":"Cardiac catheterization","c":false,"r":"ED can be an early sign of heart disease, which warrants a cardiovascular risk assessment, but cardiac catheterization isn't part of the ED workup."},{"t":"Lipid profile","c":true,"r":"ED shares vascular risk factors with cardiovascular disease."},{"t":"Fasting glucose and hemoglobin A1C","c":true,"r":"Rules out diabetes, a leading cause of ED."},{"t":"Serum CA-125","c":false,"r":"Used for ovarian cancer."},{"t":"Lumbar puncture","c":false,"r":"Not part of a standard ED workup."}],"key":"ED workup: history (sexual, health, psychosocial), glucose/A1C, lipids, hormones (testosterone, prolactin, LH, thyroid), PSA, CBC, NPT, Doppler.","chart":[],"id":88},{"topic":"Erectile Dysfunction","type":"mc","ncj":"Analyze Cues","stem":"A 34-year-old with erectile dysfunction has nocturnal penile tumescence testing that shows normal erections during sleep. The nurse recognizes this finding most likely indicates which type of cause?","o":[{"t":"Vascular insufficiency","c":false,"r":"Poor blood flow would impair sleep erections too."},{"t":"Psychological","c":true,"r":"If he has normal erections while asleep, the vascular and nerve pathways work. That points to stress, anxiety, or relationship factors, which are common causes in younger men."},{"t":"Diabetic neuropathy","c":false,"r":"Nerve damage would impair sleep erections."},{"t":"Low testosterone","c":false,"r":"Low testosterone typically reduces nocturnal erections."}],"key":"Normal nocturnal erections = the physical mechanism works, so think psychogenic. In younger men, stress, anxiety, and substance use are common causes.","chart":[],"id":89},{"topic":"Erectile Dysfunction","type":"sata","ncj":"Take Action","stem":"A client is hesitant to discuss his erectile dysfunction. Which nursing actions are appropriate? <b>Select all that apply.<\/b>","o":[{"t":"Provide privacy and reassure him the conversation is confidential","c":true,"r":"Reassuring confidentiality encourages honest disclosure."},{"t":"Refer him to a sex therapist if psychological factors are involved","c":true,"r":"Counseling addresses psychological causes."},{"t":"Explain that ED can be an early warning sign of heart disease and encourage a cardiovascular checkup","c":true,"r":"ED and CVD share risk factors and the same reduced blood flow."},{"t":"Promise that medication will work right away the first time","c":false,"r":"Many men delay care and expect immediate results. Realistic expectations prevent discouragement."},{"t":"Tell him ED is a normal part of aging and nothing can be done","c":false,"r":"Dismissive and inaccurate. Many treatments exist."},{"t":"Offer emotional support","c":true,"r":"ED affects self-esteem and relationships."}],"key":"ED care: privacy, confidentiality, support, sex therapy referral when needed, and cardiovascular evaluation.","chart":[],"id":90},{"topic":"Chronic Pelvic Pain","type":"sata","ncj":"Analyze Cues","stem":"Which conditions in the client's history could be contributing to her chronic pelvic pain? <b>Select all that apply.<\/b>","o":[{"t":"Fibrocystic breast condition","c":false,"r":"Unrelated to pelvic pain."},{"t":"Irritable bowel syndrome","c":true,"r":"IBS is an abdominal (non-gynecologic) cause of chronic pelvic pain."},{"t":"Pelvic inflammatory disease","c":true,"r":"PID is a common gynecologic cause, often through scarring and adhesions."},{"t":"Interstitial cystitis","c":true,"r":"A bladder cause of chronic pelvic pain."},{"t":"Adhesions from the complicated appendectomy","c":true,"r":"Pelvic adhesions from infection or surgery are a recognized cause."},{"t":"Well-controlled hypothyroidism","c":false,"r":"Not a cause of chronic pelvic pain."}],"key":"CPP causes: gynecologic (PID, endometriosis, cysts, fibroids, adhesions) and abdominal (IBS, interstitial cystitis, colitis). There can also be a psychological component.","chart":[{"tab":"Health History","body":"32-year-old with pain below the umbilicus and between the hips for 9 months.<br>Pelvic inflammatory disease at age 24.<br>Diagnosed with irritable bowel syndrome.<br>Urinary urgency and bladder pain that eases after voiding; interstitial cystitis suspected.<br>Ruptured appendix with complicated appendectomy at age 19.<br>Fibrocystic breast condition. Hypothyroidism, well controlled."}],"id":91},{"topic":"Chronic Pelvic Pain","type":"mc","ncj":"Recognize Cues","stem":"Which client's report meets the definition of chronic pelvic pain?","o":[{"t":"A 40-year-old with burning epigastric pain for 8 months","c":false,"r":"Epigastric pain is above the umbilicus."},{"t":"A 34-year-old with sudden right lower quadrant pain that started 6 hours ago","c":false,"r":"That's acute pain, which could be appendicitis, ectopic pregnancy, or ovarian torsion."},{"t":"A 29-year-old with pain below the umbilicus and between the hips for the past 7 months","c":true,"r":"Chronic pelvic pain is pain below the umbilicus and between the hips lasting 6 months or longer."},{"t":"A 25-year-old with pelvic cramping for 6 weeks after giving birth","c":false,"r":"Duration is under 6 months."}],"key":"CPP = below the umbilicus, between the hips, 6 months or longer.","chart":[],"id":92},{"topic":"Chronic Pelvic Pain","type":"sata","ncj":"Generate Solutions","stem":"The nurse is planning care for a client being evaluated for chronic pelvic pain. Which interventions should be included? <b>Select all that apply.<\/b>","o":[{"t":"Have the client keep a pain journal","c":true,"r":"A journal shows patterns in timing, triggers, and links to menses, voiding, or bowel habits."},{"t":"Get a detailed history and physical exam","c":true,"r":"Finding the cause starts with a thorough history and exam."},{"t":"Collect specimens to rule out sexually transmitted infections","c":true,"r":"STIs and PID are treatable causes."},{"t":"Prepare the client for ultrasound, CT, MRI, or laparoscopy as ordered","c":true,"r":"These help find structural causes such as endometriosis or adhesions."},{"t":"Assess for psychosocial factors such as stress, anxiety, and depression","c":true,"r":"There can be a psychological component, and chronic pain itself affects mood."},{"t":"Tell the client the pain is probably psychological since no cause has been found yet","c":false,"r":"That dismisses real pain before the workup is even done."},{"t":"Schedule a hysterectomy as the first step","c":false,"r":"Hysterectomy is a last resort."}],"key":"CPP workup: history and physical, pain journal, STI testing, imaging or laparoscopy, psychosocial assessment. Hysterectomy is a last resort.","chart":[],"id":93},{"topic":"Chronic Pelvic Pain","type":"mc","ncj":"Generate Solutions","stem":"After a full workup including laparoscopy, no cause is found for a client's chronic pelvic pain. Which approach should the nurse anticipate next?","o":[{"t":"Ending care because there's no physical problem","c":false,"r":"The pain is real and still needs to be managed."},{"t":"Managing the pain itself since a specific cause couldn't be found","c":true,"r":"Treat the cause if one is found. If not, treat the pain."},{"t":"Going straight to hysterectomy","c":false,"r":"Hysterectomy is reserved as a last resort."},{"t":"Starting long-term antibiotics in case of a hidden infection","c":false,"r":"There's no evidence of infection, and empiric long-term antibiotics cause harm."}],"key":"CPP: treat the cause; if none is found, treat the pain. Hysterectomy is the last resort.","chart":[],"id":94},{"topic":"Endometriosis","type":"sata","ncj":"Recognize Cues","stem":"A 28-year-old is being evaluated for possible endometriosis. Which findings should the nurse recognize as consistent with this condition? <b>Select all that apply.<\/b>","o":[{"t":"Pelvic pain that eases during menstrual bleeding","c":false,"r":"Pain from implants typically peaks around menses, when the tissue bleeds."},{"t":"Fever with purulent cervical discharge","c":false,"r":"That points to pelvic inflammatory disease."},{"t":"Dysmenorrhea that has gotten worse over time","c":true,"r":"Painful periods are a hallmark."},{"t":"Abnormal uterine bleeding","c":true,"r":"AUB is among the clinical manifestations."},{"t":"Pain during intercourse (dyspareunia)","c":true,"r":"Implants on the uterosacral ligaments and cul-de-sac cause deep dyspareunia."},{"t":"Symptoms that worsen after menopause","c":false,"r":"Implants depend on hormones, so symptoms usually subside after menopause."},{"t":"Difficulty becoming pregnant","c":true,"r":"Adhesions and inflammation contribute to infertility."}],"key":"Endometriosis: dysmenorrhea, dyspareunia, infertility, pelvic pain, AUB.","chart":[],"id":95},{"topic":"Endometriosis","type":"mc","ncj":"Analyze Cues","stem":"A client with endometriosis asks why her pain is worst during her period. Which explanation by the nurse is accurate?","o":[{"t":"\"The tissue outside your uterus still responds to your hormones, so it thickens, sheds, and bleeds each cycle, which irritates the surrounding tissue.\"","c":true,"r":"Ectopic endometrial tissue responds to hormones like the uterine lining does, causing bleeding, inflammation, and adhesions."},{"t":"\"Your uterus is pushing down into your vagina during your period.\"","c":false,"r":"That describes uterine prolapse."},{"t":"\"An infection in your fallopian tubes flares up during your period.\"","c":false,"r":"That describes PID."},{"t":"\"Cancer cells spread from your uterus each month.\"","c":false,"r":"Endometriosis is benign."}],"key":"Endometrial implants (ovaries, uterosacral ligaments, uterovesical peritoneum) thicken, shed, and bleed with each cycle.","chart":[],"id":96},{"topic":"Endometriosis","type":"sata","ncj":"Take Action","stem":"A client with severe endometriosis is starting leuprolide (a GnRH agonist). Which information should the nurse include in the teaching? <b>Select all that apply.<\/b>","o":[{"t":"\"Use a nonhormonal birth control method, such as condoms, while you take it.\"","c":true,"r":"It can harm a pregnancy, and pregnancy is still possible early in treatment."},{"t":"\"This medication permanently cures endometriosis.\"","c":false,"r":"Symptoms often return after treatment stops."},{"t":"\"Take this tablet by mouth once a day with food.\"","c":false,"r":"Leuprolide is given by injection."},{"t":"\"It can cause bone loss, so treatment is usually limited in length.\"","c":true,"r":"Low estrogen reduces bone density, so treatment is time-limited, sometimes with add-back hormone therapy."},{"t":"\"You'll probably stop having periods while you're on this medication.\"","c":true,"r":"Leuprolide suppresses ovarian hormones and causes amenorrhea."},{"t":"\"You may have hot flashes, vaginal dryness, and mood changes.\"","c":true,"r":"It causes menopause-like side effects."}],"key":"Leuprolide: amenorrhea and menopause-like effects, time-limited because of bone loss, use nonhormonal contraception.","chart":[],"id":97},{"topic":"Endometriosis","type":"sata","ncj":"Generate Solutions","stem":"A 24-year-old with mild endometriosis hopes to become pregnant in a few years. Which treatments should the nurse anticipate? <b>Select all that apply.<\/b>","o":[{"t":"A course of antibiotics","c":false,"r":"Endometriosis isn't an infection."},{"t":"Total hysterectomy with bilateral salpingo-oophorectomy","c":false,"r":"This ends fertility. It's reserved for severe disease once childbearing is complete."},{"t":"NSAIDs for pain","c":true,"r":"NSAIDs reduce prostaglandin-driven pain and inflammation."},{"t":"Watchful waiting with monitoring of symptoms","c":true,"r":"With mild disease, watch-and-wait is an option."},{"t":"Oral contraceptives to suppress cycles until she wants to conceive","c":true,"r":"OCPs reduce hormonal stimulation of implants and can be stopped when she is ready to try."}],"key":"Treatment depends on age, severity, and desire for pregnancy: watch-and-wait, OCPs, NSAIDs, GnRH agonists. Surgery is for severe cases.","chart":[],"id":98},{"topic":"Endometriosis","type":"mc","ncj":"Generate Solutions","stem":"Which procedure should the nurse anticipate to definitively diagnose endometriosis?","o":[{"t":"Laparoscopy","c":true,"r":"Laparoscopy lets the surgeon see implants directly (and biopsy or remove them). It's the definitive diagnostic procedure."},{"t":"Transvaginal ultrasound","c":false,"r":"Ultrasound can show ovarian endometriomas, but it misses most small implants and can't confirm the diagnosis."},{"t":"CA-125 level","c":false,"r":"CA-125 can be mildly elevated in endometriosis, but it's nonspecific and can't confirm the diagnosis."},{"t":"Pap test","c":false,"r":"A Pap test screens cervical cells."}],"key":"Endometriosis is definitively diagnosed by laparoscopy.","chart":[],"id":99},{"topic":"Endometriosis","type":"sata","ncj":"Evaluate Outcomes","stem":"The nurse has taught a client with endometriosis about her condition and treatment with NSAIDs and oral contraceptives. Which statements by the client indicate understanding? <b>Select all that apply.<\/b>","o":[{"t":"\"The birth control pills will cure my endometriosis for good.\"","c":false,"r":"OCPs control symptoms but don't cure the disease."},{"t":"\"I'll take my ibuprofen with food.\"","c":true,"r":"Taking NSAIDs with food lowers GI irritation."},{"t":"\"I'll start my ibuprofen when my period starts instead of waiting until the pain is bad.\"","c":true,"r":"NSAIDs work best started early, before prostaglandin levels peak."},{"t":"\"Endometriosis is caused by a sexually transmitted infection.\"","c":false,"r":"The cause is unknown. It isn't an STI."},{"t":"\"My symptoms will probably get better after menopause.\"","c":true,"r":"Without cyclic hormones, implants become inactive."},{"t":"\"The tissue outside my uterus bleeds each cycle, and that's why I hurt.\"","c":true,"r":"Accurate description of the pathophysiology."}],"key":"Endometriosis is hormone-driven and managed (not cured) with NSAIDs, OCPs, or GnRH agonists. It usually improves after menopause.","chart":[],"id":100}];
const QMAP = new Map(QS.map(q => [q.id, q]));
const TOPICS = [...new Set(QS.map(q => q.topic))];
const NCJ_ORDER = ["Recognize Cues","Analyze Cues","Prioritize Hypotheses","Generate Solutions","Take Action","Evaluate Outcomes"];
const LETTERS = "ABCDEFGH";
const K_SESSION = "reproNGN.session.v1", K_HIST = "reproNGN.history.v1", K_PREFS = "reproNGN.prefs.v1";
const store = {
  get(k){ try { const s = localStorage.getItem(k); return s ? JSON.parse(s) : null; } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const DEFAULT_PREFS = { mode:"practice", count:"all", topics:TOPICS.slice(), qtype:"all", pool:"all", shuffleQ:true, shuffleO:true, limit:"none" };
let prefs = Object.assign({}, DEFAULT_PREFS, store.get(K_PREFS) || {});
prefs.topics = (prefs.topics || []).filter(t => TOPICS.includes(t));
let H = store.get(K_HIST) || {};
let S = null, view = "home", rv = { list:[], pos:0 }, chartTab = 0, overlay = null, resetArmed = false;

const app = document.getElementById("app");
const oroot = document.getElementById("overlay-root");
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = (a,b) => b ? Math.round(a / b * 100) : 0;
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function fmt(sec){ sec = Math.max(0, Math.round(sec)); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60, p = n => String(n).padStart(2, "0"); return h ? h + ":" + p(m) + ":" + p(s) : p(m) + ":" + p(s); }
const reduceMotion = () => window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const IC = {
  flag: on => `<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4h11.5l-2.2 4 2.2 4H5" fill="${on ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`,
  grid: `<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>`,
  strike: `<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 7.2C15.8 5.6 14.1 4.5 12 4.5c-2.6 0-4.4 1.4-4.4 3.3 0 1.4.9 2.4 2.6 3.1M7.3 16.6c.7 1.8 2.5 2.9 4.8 2.9 2.7 0 4.6-1.5 4.6-3.5 0-.8-.3-1.5-.8-2M3.5 12h17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>`,
  home: `<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11 12 4l8 7M6 9.5V20h12V9.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`
};

/* ---------- session model ---------- */
function saveS(){ if (S) store.set(K_SESSION, S); }
function curId(){ return view === "review" ? rv.list[rv.pos] : S.ids[S.cur]; }
function isGraded(id){ return S.mode === "practice" ? !!S.sub[id] : !!S.finished; }
function isAnswered(id){ return S.mode === "practice" ? !!S.sub[id] : (S.ans[id] || []).length > 0; }
function score(id){
  const q = QMAP.get(id), sel = S.ans[id] || [], nC = q.o.filter(o => o.c).length;
  const max = q.type === "mc" ? 1 : nC;
  if (!sel.length || !isGraded(id)) return { pts:0, max, full:false, answered:false };
  if (q.type === "mc"){ const ok = !!q.o[sel[0]].c; return { pts: ok ? 1 : 0, max, full: ok, answered:true }; }
  let pts = 0; sel.forEach(i => { pts += q.o[i].c ? 1 : -1; });
  pts = Math.max(0, pts);
  return { pts, max, full: sel.length === nC && sel.every(i => q.o[i].c), answered:true };
}
function status(id){
  if (isGraded(id)){ const r = score(id); if (!r.answered) return "skip"; return r.full ? "ok" : (r.pts > 0 ? "part" : "bad"); }
  if (S.finished) return "skip";
  return isAnswered(id) ? "ans" : "none";
}
function rec(id){
  const r = score(id), e = H[id] || { a:0, c:0, last:0 };
  e.a++; if (r.full) e.c++; e.last = r.full ? 1 : 0; H[id] = e;
}
function poolFor(p){
  return QS.filter(q => p.topics.includes(q.topic) && (p.qtype === "all" || q.type === p.qtype) &&
    (p.pool === "all" || (p.pool === "unseen" && !H[q.id]) || (p.pool === "missed" && H[q.id] && H[q.id].last === 0)));
}
function nFor(p, pool){ return p.count === "all" ? pool.length : Math.min(+p.count, pool.length); }

function startSession(ids, mode, opts){
  const perm = {};
  ids.forEach(id => { const n = QMAP.get(id).o.length, base = [...Array(n).keys()]; perm[id] = opts.shuffleO ? shuffle(base) : base; });
  S = { v:1, mode, ids, cur:0, ans:{}, sub:{}, flags:{}, strike:{}, perm, elapsed:0, limit: opts.limit || 0, finished:false, started: Date.now() };
  saveS(); chartTab = 0; go("quiz");
}
function startFromPrefs(){
  const pool = poolFor(prefs), n = nFor(prefs, pool);
  if (!n) return;
  let chosen;
  if (n >= pool.length) chosen = pool.slice();
  else if (prefs.qtype === "all"){
    const sa = shuffle(pool.filter(q => q.type === "sata")), mc = shuffle(pool.filter(q => q.type === "mc"));
    let ns = Math.round(n * 0.6), nm = n - ns;
    if (ns > sa.length){ nm += ns - sa.length; ns = sa.length; }
    if (nm > mc.length){ ns += nm - mc.length; nm = mc.length; }
    chosen = sa.slice(0, ns).concat(mc.slice(0, nm));
  } else chosen = shuffle(pool).slice(0, n);
  chosen = prefs.shuffleQ ? shuffle(chosen) : chosen.sort((a, b) => a.id - b.id);
  const lim = prefs.mode === "exam" && prefs.limit !== "none" ? chosen.length * (+prefs.limit) : 0;
  startSession(chosen.map(q => q.id), prefs.mode, { shuffleO: prefs.shuffleO, limit: lim });
}
function finishExam(auto){
  if (!S || S.finished) return;
  S.finished = true; S.ids.forEach(rec); store.set(K_HIST, H); saveS();
  closeOverlay(); go("results");
  if (auto) toast("Time is up. Your exam was submitted.");
}
function finishPractice(){ if (!S) return; S.finished = true; saveS(); closeOverlay(); go("results"); }

function syncHome(){
  const f = $("#setup"); if (!f) return;
  const setR = (name, val) => f.querySelectorAll(`input[name=${name}]`).forEach(i => { i.checked = i.value === String(val); });

  f.querySelectorAll("input[name=topic]").forEach(i => { i.checked = prefs.topics.includes(i.value); });
  $("#shuffleQ").checked = !!prefs.shuffleQ; $("#shuffleO").checked = !!prefs.shuffleO;
  ["all","unseen","missed"].forEach(p => { $("#pc-" + p).textContent = poolFor(Object.assign({}, prefs, { pool:p })).length; });
  TOPICS.forEach((t, i) => { $(`[data-tc="${i}"]`).textContent = poolFor(Object.assign({}, prefs, { topics:[t] })).length; });
  const pool = poolFor(prefs), n = nFor(prefs, pool);
  $("#cnt-all").textContent = pool.length;
  f.querySelectorAll("input[name=count]").forEach(i => { i.disabled = i.value !== "all" && +i.value > pool.length; });
  $("#fs-limit").hidden = prefs.mode !== "exam";
  const btn = $("#start");
  btn.textContent = `Start ${prefs.mode === "exam" ? "exam" : "practice"} · ${n} item${n === 1 ? "" : "s"}`;
  btn.disabled = !n;
  let note = "";
  if (!n) note = prefs.pool === "missed" ? "No missed items yet. Finish a session first, or pick a different pool." : prefs.pool === "unseen" ? "You've attempted every item that matches. Pick a different pool." : "No items match. Select at least one topic.";
  else if (prefs.count !== "all" && +prefs.count > pool.length) note = `Only ${pool.length} items match these settings.`;
  else if (prefs.mode === "exam" && prefs.limit !== "none") note = `Time limit: ${fmt(n * +prefs.limit)}. The exam submits itself when time runs out.`;
  else if (prefs.mode === "exam") note = "Untimed. Elapsed time is still shown.";
  else note = "Rationales appear after you submit each answer.";
  $("#start-note").textContent = note;
}

/* ---------- RESULTS ---------- */
function groupStats(ids, keyFn, order){
  const m = new Map(); order.forEach(k => m.set(k, { n:0, full:0, pts:0, max:0 }));
  ids.forEach(id => { const q = QMAP.get(id), k = keyFn(q), r = score(id); if (!m.has(k)) m.set(k, { n:0, full:0, pts:0, max:0 }); const g = m.get(k); g.n++; g.full += r.full ? 1 : 0; g.pts += r.pts; g.max += r.max; });
  return [...m.entries()].filter(([, g]) => g.n > 0);
}
const band = p => p >= 80 ? "ok" : p >= 60 ? "warn" : "bad";
function bdHTML(rows, labelFn){
