<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reproductive NGN Exam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: exam console. Sticky item bar on top, client record beside the item on wide screens (NGN split view), action bar pinned to the bottom. */
:root{
  --bg:#F1F3F4; --surface:#FFFFFF; --surface-2:#E8ECEE; --ink:#15212A; --muted:#55636D; --line:#D2D9DE;
  --accent:#88214E; --accent-ink:#FFFFFF; --accent-soft:#F6E7EE; --accent-line:#DDB3C6;
  --ok:#1C6E45; --ok-soft:#E1F1E7; --bad:#AE271E; --bad-soft:#FAE6E4; --warn:#94600A; --warn-soft:#F9EED6;
  --focus:#88214E; --shadow:0 1px 2px rgba(21,33,42,.06),0 6px 18px rgba(21,33,42,.06); --scrim:rgba(21,33,42,.42);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11171B; --surface:#192127; --surface-2:#222C33; --ink:#E5EBEE; --muted:#9AA8B1; --line:#2F3B43;
  --accent:#E585AE; --accent-ink:#22101A; --accent-soft:#3A2130; --accent-line:#6A3A50;
  --ok:#62C792; --ok-soft:#163226; --bad:#F2877E; --bad-soft:#3B1E1C; --warn:#E6B356; --warn-soft:#382C15;
  --focus:#E585AE; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11171B; --surface:#192127; --surface-2:#222C33; --ink:#E5EBEE; --muted:#9AA8B1; --line:#2F3B43;
  --accent:#E585AE; --accent-ink:#22101A; --accent-soft:#3A2130; --accent-line:#6A3A50;
  --ok:#62C792; --ok-soft:#163226; --bad:#F2877E; --bad-soft:#3B1E1C; --warn:#E6B356; --warn-soft:#382C15;
  --focus:#E585AE; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:clamp(16px,3vw,32px)}
.muted{color:var(--muted)}
.eyebrow{font:600 12px/1.2 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.h-sm{font:600 12px/1.2 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.spacer{flex:1}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border:1.5px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink);font-weight:700;font-size:16px;line-height:1.1;transition:border-color .12s,background .12s}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.07);border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover:not(:disabled){border-color:var(--line);color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.big{min-height:54px;font-size:18px;padding-inline:26px}
.btn svg,.tbtn svg{flex:none}

/* ---------- HOME ---------- */
.home{padding-block:clamp(24px,5vw,56px) 64px;display:grid;gap:32px}
@media (min-width:980px){.home{grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:48px;align-items:start}.intro{position:sticky;top:calc(env(safe-area-inset-top,0px) + 28px)}}
.intro{display:grid;gap:22px;min-width:0}
.intro h1{font:700 clamp(36px,5.4vw,56px)/1 var(--f-display);letter-spacing:-.025em;margin-top:8px}
.lede{font-size:18px;max-width:46ch;color:var(--ink)}
.facts{display:grid;grid-template-columns:repeat(4,auto);justify-content:start;gap:8px 28px;margin:0}
.facts div{display:grid;gap:2px}
.facts dt{font:500 11px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:0;font:700 30px/1 var(--f-display);font-variant-numeric:tabular-nums}
@media (max-width:420px){.facts{grid-template-columns:repeat(2,auto)}}
.resume{display:grid;gap:12px;padding:16px 18px;border:1.5px solid var(--accent-line);background:var(--accent-soft);border-radius:12px}
.resume p+p{margin-top:4px}
.resume .meta{font:500 14px/1.4 var(--f-mono);color:var(--ink);font-variant-numeric:tabular-nums}
.ncjbox{display:grid;gap:10px}
.ncj-list{list-style:none;margin:0;padding:0;display:grid;gap:7px;counter-reset:s}
.ncj-list li{display:grid;grid-template-columns:22px minmax(0,1fr) 92px 28px;align-items:center;gap:10px;font-size:15px;counter-increment:s}
.ncj-list li::before{content:counter(s);font:600 12px var(--f-mono);color:var(--muted);text-align:right}
.mini{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.mini i{display:block;height:100%;background:var(--accent)}
.ncj-list b{font:600 14px var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
details.howto{border-top:1px solid var(--line);padding-top:14px}
details.howto summary{cursor:pointer;font-weight:700}
details.howto .body{display:grid;gap:10px;margin-top:10px;font-size:15px;color:var(--ink);max-width:60ch}
kbd{font:500 12.5px var(--f-mono);padding:1px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;background:var(--surface)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px}

.setup{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:clamp(18px,3vw,30px);display:grid;gap:24px;box-shadow:var(--shadow);min-width:0}
.setup h2{font:700 24px/1.15 var(--f-display);letter-spacing:-.01em}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0;margin-bottom:10px;font:600 12px/1.2 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.fs-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px}
.fs-head legend{margin:0}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.mode{position:relative;display:block}
.mode input,.seg input,.chip-in input,.sw input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.mode-card{display:grid;gap:4px;height:100%;padding:14px 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;transition:border-color .12s,background .12s}
.mode-card b{font:700 18px/1.2 var(--f-display)}
.mode-card span{font-size:14.5px;color:var(--muted);line-height:1.45}
.mode input:checked+.mode-card{border-color:var(--accent);background:var(--accent-soft)}
.mode input:checked+.mode-card b{color:var(--accent)}
.mode input:focus-visible+.mode-card,.seg input:focus-visible+span,.chip-in input:focus-visible+span,.sw input:focus-visible+.track{outline:3px solid var(--focus);outline-offset:2px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg label,.chip-in{position:relative;display:inline-flex}
.seg span,.chip-in span{display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:7px 13px;border:1.5px solid var(--line);border-radius:9px;background:var(--surface);font-weight:700;font-size:15px;cursor:pointer;transition:border-color .12s,background .12s}
.seg input:checked+span,.chip-in input:checked+span{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.seg input:disabled+span,.chip-in input:disabled+span{opacity:.4;cursor:not-allowed}
.n{font:500 12px/1 var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.seg input:checked+span .n,.chip-in input:checked+span .n{color:var(--accent)}
.topics{display:flex;flex-wrap:wrap;gap:8px}
.tools{display:flex;gap:14px;font-size:14px}
.sws{display:grid;gap:12px}
.sw{position:relative;display:flex;align-items:center;gap:12px;cursor:pointer;font-weight:700;font-size:15.5px}
.track{flex:none;width:42px;height:24px;border-radius:12px;background:var(--surface-2);border:1.5px solid var(--line);position:relative;transition:background .15s}
.track::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.sw input:checked+.track{background:var(--accent);border-color:var(--accent)}
.sw input:checked+.track::after{transform:translateX(18px);background:var(--accent-ink)}
.sw small{display:block;font-weight:400;color:var(--muted);font-size:13.5px}
.startrow{display:grid;gap:10px;padding-top:6px;border-top:1px solid var(--line)}
.startrow .btn{width:100%;margin-top:14px}
#start-note{font-size:14px;min-height:1.4em}

/* ---------- TOP BAR ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.tb{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;padding-block:10px}
.brand{display:inline-flex;align-items:center;gap:8px;border:0;background:none;padding:4px 2px;font:700 16px/1 var(--f-display);color:var(--accent)}
.counter{font:600 16px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.counter .of{color:var(--muted);font-weight:500}
.chip{font:600 11.5px/1 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;padding:6px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.sata{background:var(--accent-soft);color:var(--accent)}
.topic{font-size:14.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.timer{font:500 15px/1 var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted);padding:6px 8px;border-radius:6px;background:var(--surface-2)}
.timer.low{color:var(--bad);background:var(--bad-soft)}
.tbtn{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:6px 11px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);font-weight:700;font-size:14.5px}
.tbtn:hover{border-color:var(--muted)}
.tbtn.on{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.progress{height:4px;background:var(--surface-2)}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
@media (max-width:640px){.hide-sm{display:none}.topic{display:none}.tb{gap:8px}.tbtn{padding-inline:8px;min-height:36px}.timer{font-size:13.5px;padding:5px 6px}.counter{font-size:15px}.chip{padding:5px 6px}.brand{padding:4px 0}}

/* ---------- ITEM ---------- */
.qmain{padding-block:24px 36px}
.qgrid{display:grid;gap:22px}
@media (min-width:980px){
  .qgrid.has-chart{grid-template-columns:minmax(0,5fr) minmax(0,7fr);align-items:start;gap:28px}
  .qgrid.has-chart .exhibit{position:sticky;top:calc(env(safe-area-inset-top,0px) + 82px);max-height:calc(100vh - 190px);overflow:auto}
  .qgrid:not(.has-chart) .item{max-width:820px}
}
.exhibit{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0;overflow:hidden}
.ex-head{display:flex;align-items:center;gap:8px;padding:10px 16px;font:600 12px/1 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
.tabs{display:flex;overflow-x:auto;background:var(--surface-2);border-bottom:1px solid var(--line)}
.tab{flex:none;border:0;border-bottom:2.5px solid transparent;background:none;padding:10px 14px;font:600 13.5px/1.2 var(--f-body);color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);border-bottom-color:var(--accent)}
.ex-body{padding:16px 18px 18px;font-size:16px;line-height:1.7;font-variant-numeric:tabular-nums}
.item{min-width:0;display:grid;gap:14px}
.ncj{font:600 12px/1.2 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.stem{font-size:19px;line-height:1.55;max-width:70ch}
.stem:focus{outline:none}
.opts{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.opt{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;background:var(--surface);border:1.5px solid var(--line);border-radius:11px;transition:border-color .12s,background .12s}
.opt-main{display:flex;gap:12px;align-items:flex-start;padding:13px 4px 13px 14px;cursor:pointer;min-width:0}
.opt input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.box{flex:none;width:22px;height:22px;margin-top:2px;border:2px solid var(--muted);border-radius:5px;background:var(--surface);display:grid;place-items:center}
.single .box{border-radius:50%}
.opt.sel .box{background:var(--accent);border-color:var(--accent)}
.multi .opt.sel .box::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.single .opt.sel .box::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent-ink)}
.opt input:focus-visible~.box{outline:3px solid var(--focus);outline-offset:2px}
.letter{flex:none;width:1.3em;font:600 14px/1.6 var(--f-mono);color:var(--muted);margin-top:1px}
.otext{min-width:0;font-size:17px}
.opt:not(.locked):hover{border-color:var(--muted)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.strike{border:0;background:none;color:var(--muted);padding:12px 12px;border-radius:8px;line-height:0;opacity:.55}
.strike:hover,.strike[aria-pressed="true"]{opacity:1;color:var(--ink)}
.opt.struck .otext{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--muted)}
.opt.struck .letter{color:var(--line)}
.opt.locked .opt-main{cursor:default}
.opt.g-hit{border-color:var(--ok);background:var(--ok-soft)}
.opt.g-miss{border-color:var(--ok);border-style:dashed}
.opt.g-wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.g-hit .box{background:var(--ok);border-color:var(--ok)}
.opt.g-wrong .box{background:var(--bad);border-color:var(--bad)}
.why{grid-column:1/-1;padding:0 16px 14px 63px;font-size:15.5px;line-height:1.55}
@media (max-width:520px){.why{padding-left:16px}}
.vtag{display:inline-block;margin-right:6px;padding:3px 7px;border-radius:5px;font:600 11px/1.3 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;vertical-align:1px}
.vtag.ok{background:var(--ok);color:var(--surface)}
.vtag.miss{background:var(--warn-soft);color:var(--warn)}
.vtag.bad{background:var(--bad);color:var(--surface)}
.vtag.neutral{background:var(--surface-2);color:var(--muted)}
.fb{display:grid;gap:12px;padding:16px 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);scroll-margin-top:110px;scroll-margin-bottom:100px}
.fb-head{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;justify-content:space-between}
.fb-head strong{font:700 22px/1.1 var(--f-display)}
.fb-score{font:600 14px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.fb-ok{border-color:var(--ok)}.fb-ok .fb-head strong,.fb-ok .fb-score{color:var(--ok)}
.fb-part{border-color:var(--warn)}.fb-part .fb-head strong,.fb-part .fb-score{color:var(--warn)}
.fb-bad,.fb-none{border-color:var(--bad)}.fb-bad .fb-head strong,.fb-bad .fb-score,.fb-none .fb-head strong,.fb-none .fb-score{color:var(--bad)}
.fb-ans{font-size:15.5px}
.key{background:var(--surface-2);border-radius:9px;padding:12px 14px;display:grid;gap:4px}
.key p{font-size:15.5px}
.lbl{font:600 11.5px/1.2 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.ngn-note{font-size:13.5px;color:var(--muted)}

/* ---------- ACTION BAR ---------- */
.actions{position:sticky;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line)}
.act{display:flex;gap:10px;align-items:center;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px))}
.kbhint{font-size:13px;color:var(--muted)}
@media (max-width:820px){.kbhint{display:none}}
@media (max-width:420px){.act .btn{padding-inline:12px}}

/* ---------- OVERLAYS ---------- */
.ov{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;justify-content:flex-end}
.ov.center{align-items:center;justify-content:center;padding:16px}
.panel{width:min(440px,100%);height:100%;background:var(--surface);display:flex;flex-direction:column;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px)}
.panel-head{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.panel-head h2{font:700 20px/1 var(--f-display)}
.panel-body{padding:16px 18px calc(24px + env(safe-area-inset-bottom,0px));overflow:auto;display:grid;gap:16px;align-content:start}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw8{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--line);background:var(--surface);position:relative}
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:7px}
.nb{position:relative;height:44px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);font:600 14px/1 var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.nb:hover{border-color:var(--muted)}
.nb.ans,.sw8.ans{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.nb.ok,.sw8.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.nb.part,.sw8.part{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.nb.bad,.sw8.bad,.nb.skip,.sw8.skip{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.nb.skip,.sw8.skip{border-style:dashed}
.nb.cur{box-shadow:0 0 0 2.5px var(--ink)}
.nb.flag::after,.sw8.flag::after{content:"";position:absolute;top:-1px;right:-1px;border-top:11px solid var(--warn);border-left:11px solid transparent;border-top-right-radius:6px}
.sw8.flag::after{border-top-width:8px;border-left-width:8px;border-top-right-radius:3px}
.dlg{width:min(460px,100%);background:var(--surface);border-radius:14px;padding:22px;display:grid;gap:12px;box-shadow:var(--shadow)}
.dlg h2{font:700 21px/1.2 var(--f-display)}
.dlg .row{justify-content:flex-end;margin-top:6px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-weight:700;font-size:15px;box-shadow:var(--shadow)}

/* ---------- SUBMIT REVIEW + RESULTS ---------- */
.page{padding-block:clamp(24px,4vw,44px) 64px;display:grid;gap:26px}
.page h1{font:700 clamp(30px,4.5vw,44px)/1.05 var(--f-display);letter-spacing:-.02em;margin-top:6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:4px}
.tile b{font:700 30px/1 var(--f-display);font-variant-numeric:tabular-nums}
.tile.warn b{color:var(--warn)} .tile.bad b{color:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(16px,2.6vw,24px);display:grid;gap:14px;align-content:start;min-width:0}
.card h2{font:700 20px/1.2 var(--f-display)}
.jumplist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.jumplist button{display:flex;gap:10px;width:100%;text-align:left;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:15px}
.jumplist button:hover{border-color:var(--muted)}
.jumplist .n{font-size:13px;line-height:1.5}
.res-top{display:grid;gap:16px}
@media (min-width:760px){.res-top{grid-template-columns:minmax(0,4fr) minmax(0,7fr);align-items:stretch}}
.big{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 22px;display:grid;align-content:center;gap:6px}
.big .num{font:700 clamp(64px,10vw,96px)/.9 var(--f-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.big .num small{font-size:.45em;margin-left:2px;color:var(--muted)}
.big.ok .num{color:var(--ok)} .big.warn .num{color:var(--warn)} .big.bad .num{color:var(--bad)}
.metrics{margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.metrics div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:4px;align-content:start}
.metrics dt{font:500 11px/1.25 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.metrics dd{margin:0;font:700 24px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.metrics dd small{display:block;font:400 13.5px/1.35 var(--f-body);color:var(--muted);margin-top:3px}
.focus{padding:12px 16px;border-radius:10px;background:var(--warn-soft);color:var(--ink);font-size:15.5px}
.bd{display:grid;gap:8px}
.bd-row{display:grid;grid-template-columns:minmax(0,1.6fr) 58px minmax(70px,1.4fr) 46px;gap:12px;align-items:center;font-size:15.5px;padding-block:4px}
.bd-row .nm{min-width:0}
.bd-row .ct{font:500 13.5px var(--f-mono);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.bd-row .pc{font:600 14px var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.bar{height:9px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px}
.bar i.ok{background:var(--ok)} .bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)}
.bd-head{display:grid;grid-template-columns:minmax(0,1.6fr) 58px minmax(70px,1.4fr) 46px;gap:12px;font:500 11px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-bottom:6px;border-bottom:1px solid var(--line)}
.bd-head span:nth-child(2),.bd-head span:nth-child(4){text-align:right}
@media (max-width:480px){.bd-row,.bd-head{grid-template-columns:minmax(0,1fr) 50px 42px}.bd-row .bar,.bd-head span:nth-child(3){display:none}}
.two{display:grid;gap:18px}
@media (min-width:860px){.two{grid-template-columns:1fr 1fr}}

@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

"use strict";
const QS = [{"topic":"Breast Cancer","type":"sata","ncj":"Recognize Cues","stem":"The nurse reviews the client's health history. Which findings increase the client's risk for breast cancer? <b>Select all that apply.<\/b>","o":[{"t":"Walks 30 minutes, 5 days a week","c":false,"r":"Regular exercise is protective. A sedentary lifestyle is the risk factor."},{"t":"Mother diagnosed with breast cancer at age 44","c":true,"r":"A first-degree relative doubles the risk, and the hereditary link is stronger when that relative was premenopausal at diagnosis."},{"t":"History of fibrocystic breast condition","c":false,"r":"FBC is a benign, exaggerated response to cyclic hormones and is not linked to an increased risk of breast cancer."},{"t":"Menopause at age 48","c":false,"r":"Late menopause (after about age 55) is the risk factor. Menopause at 48 actually shortens estrogen exposure."},{"t":"Drinks 2 to 3 glasses of wine most nights","c":true,"r":"Alcohol raises breast cancer risk in a dose-related way, so limiting alcohol is part of risk-reduction teaching."},{"t":"Menarche at age 10","c":true,"r":"Early menarche (before age 12) lengthens lifetime exposure to estrogen, which is tied to breast cancer development."},{"t":"BMI of 33","c":true,"r":"Obesity and weight gain in adulthood are modifiable risk factors. After menopause, fat tissue becomes a major source of estrogen."}],"key":"Hereditary risk is strongest when the affected relative is first-degree, was premenopausal, had bilateral disease, or also had ovarian cancer. Still, most women who get breast cancer have no identifiable risk factors, so screening matters for everyone.","chart":[{"tab":"Health History","body":"52-year-old client at an annual wellness visit.<br>Menarche at age 10. Menopause at age 48. Never pregnant.<br>BMI 33. Drinks 2 to 3 glasses of wine most nights.<br>Mother diagnosed with breast cancer at age 44.<br>History of fibrocystic breast condition in her 30s.<br>Walks 30 minutes, 5 days a week."}],"id":1},{"topic":"Breast Cancer","type":"mc","ncj":"Generate Solutions","stem":"A 56-year-old client at average risk for breast cancer has had yearly mammograms since age 45, all normal. She asks whether she still needs a mammogram every year. Which response by the nurse is consistent with American Cancer Society (ACS) guidelines?","o":[{"t":"\"Since you're over 55 and your results have always been normal, you can stop screening mammograms.\"","c":false,"r":"There's no stop age at 55. Screening continues as long as the woman is in good health."},{"t":"\"Now that you're postmenopausal, monthly breast self-exams can replace your mammograms.\"","c":false,"r":"Breast self-exam builds breast self-awareness, but it never replaces mammography."},{"t":"\"Your risk goes up with age, so you'll now need a mammogram and a clinical breast exam every 6 months.\"","c":false,"r":"Nothing supports 6-month screening for average-risk women, and ACS does not recommend clinical breast exams for average-risk women at any age."},{"t":"\"At 55 and older you can switch to a mammogram every 2 years or keep going yearly, and screening continues as long as your overall health is good.\"","c":true,"r":"ACS: yearly from 45 to 54, then every 2 years at 55 and older (with the option to stay yearly). Screening continues while overall health is good."}],"key":"ACS, average risk: option to start at 40 to 44, yearly from 45 to 54, every 2 years at 55+ (or keep yearly), and continue while healthy. No routine CBE for average-risk women.","chart":[],"id":2},{"topic":"Breast Cancer","type":"sata","ncj":"Generate Solutions","stem":"A 30-year-old client tested positive for a BRCA1 mutation after her sister was diagnosed with breast cancer at 36. Which components should the nurse anticipate in this client's plan of care? <b>Select all that apply.<\/b>","o":[{"t":"Breast ultrasound alone as her yearly screening test","c":false,"r":"Ultrasound is a diagnostic add-on (for example, telling a solid mass from a cyst). It isn't a stand-alone screening test for high-risk women."},{"t":"Counseling about risk-reducing (prophylactic) mastectomy and oophorectomy","c":true,"r":"Prophylactic mastectomy and oophorectomy can lower breast and ovarian cancer risk in BRCA1 and BRCA2 carriers. She needs full information to decide."},{"t":"Annual breast MRI along with mammography","c":true,"r":"Breast MRI is recommended for women at high risk, such as BRCA carriers."},{"t":"Waiting until age 45 to begin mammograms since she has no symptoms","c":false,"r":"Age 45 is the average-risk guideline. A BRCA1 carrier needs earlier, more intensive surveillance."},{"t":"Starting screening mammography earlier than average-risk women, often with 3D mammography","c":true,"r":"Increased-risk women start screening earlier, and 3D mammography (tomosynthesis) improves detection."},{"t":"More frequent clinical breast exams","c":true,"r":"Even though ACS doesn't recommend CBE for average-risk women, more frequent CBEs are part of the plan for women at increased risk."}],"key":"High risk (BRCA, strong family history) = earlier screening, 3D mammography, breast MRI, more frequent CBEs, and genetic counseling about prophylactic surgery.","chart":[],"id":3},{"topic":"Breast Cancer","type":"mc","ncj":"Analyze Cues","stem":"The nurse is reviewing four clients who carry a BRCA2 mutation and are considering bilateral prophylactic oophorectomy. For which client would oophorectomy be expected to lower the risk of <b>breast<\/b> cancer as well as ovarian cancer?","o":[{"t":"A 70-year-old taking estrogen-only hormone therapy","c":false,"r":"Postmenopausal, so no breast cancer benefit from oophorectomy. Her estrogen therapy is the more relevant concern."},{"t":"A 55-year-old who completed menopause 3 years ago and has dense breasts","c":false,"r":"She is postmenopausal, so oophorectomy won't lower breast cancer risk. Dense breasts call for closer imaging, not oophorectomy."},{"t":"A 62-year-old who has been postmenopausal for 10 years","c":false,"r":"Oophorectomy still lowers her ovarian cancer risk, but it doesn't lower breast cancer risk after menopause because the ovaries are no longer the main estrogen source."},{"t":"A 38-year-old who is premenopausal and has finished having children","c":true,"r":"Before menopause, the ovaries are the main source of estrogen. Removing them lowers both breast and ovarian cancer risk."}],"key":"Ovaries are the main estrogen source only before menopause. Prophylactic oophorectomy lowers breast cancer risk in premenopausal BRCA carriers; it lowers ovarian cancer risk at any age.","chart":[],"id":4},{"topic":"Breast Cancer","type":"sata","ncj":"Recognize Cues","stem":"During a clinical breast exam, the nurse palpates a mass in a 64-year-old client's left breast. Which characteristics of the mass are most consistent with breast cancer? <b>Select all that apply.<\/b>","o":[{"t":"Smooth, rubbery, and freely movable","c":false,"r":"This describes a fibroadenoma."},{"t":"Located in the upper outer quadrant","c":true,"r":"About half of breast cancers occur in the upper outer quadrant, where there is the most glandular tissue."},{"t":"Hard consistency","c":true,"r":"Malignant masses are typically hard."},{"t":"Nontender to palpation","c":true,"r":"Breast cancer is usually painless. Many students assume pain means cancer, but tenderness is more typical of FBC."},{"t":"Fixed to the underlying tissue","c":true,"r":"Malignant lesions are nonmobile because they attach to surrounding structures."},{"t":"Accompanied by bilateral breast pain that comes and goes with her cycle","c":false,"r":"Cyclic, bilateral pain points to FBC, and at 64 she is almost certainly postmenopausal."},{"t":"Irregular, poorly delineated borders","c":true,"r":"Cancer invades surrounding tissue, so the edges are irregular and hard to define."}],"key":"Cancer feels hard, irregular, fixed, and painless, most often in the upper outer quadrant. It may come with nipple discharge or retraction.","chart":[],"id":5},{"topic":"Breast Cancer","type":"mc","ncj":"Prioritize Hypotheses","stem":"Which condition is the nurse most concerned about?","o":[{"t":"Fibroadenoma","c":false,"r":"A fibroadenoma is a distinct, mobile, painless lump with no skin changes."},{"t":"Lactational mastitis","c":false,"r":"She isn't breastfeeding, has no fever, and didn't improve with antibiotics."},{"t":"Fibrocystic breast condition","c":false,"r":"FBC causes tender, lumpy breasts that change with the cycle, not redness and skin thickening."},{"t":"Inflammatory breast cancer","c":true,"r":"Redness, warmth, and peau d'orange skin, often without a distinct lump and not responding to antibiotics, fit inflammatory breast cancer. Cancer cells block lymph channels in the skin. It's aggressive and fast-growing with high metastasis risk, so she needs prompt biopsy."}],"key":"Red, warm breast + peau d'orange + no fever + no response to antibiotics = think inflammatory breast cancer.","chart":[{"tab":"Nurses' Notes","body":"47-year-old reports her right breast has been 'red and swollen' for 3 weeks. Not pregnant or breastfeeding. Finished 10 days of oral antibiotics for suspected mastitis with no improvement.<br>Right breast warm and red over more than a third of the breast. Skin thickened with a pitted, orange-peel look. No discrete lump palpated.<br>T 98.6&deg;F (37&deg;C)."}],"id":6},{"topic":"Breast Cancer","type":"sata","ncj":"Analyze Cues","stem":"A client's biopsy shows triple-negative breast cancer. Which statements about this type of cancer are accurate? <b>Select all that apply.<\/b>","o":[{"t":"It has a higher incidence among Black and Hispanic women.","c":true,"r":"Per the study guide, incidence is higher in Black and Hispanic women."},{"t":"The tumor tests negative for estrogen, progesterone, and HER-2 receptors.","c":true,"r":"That's the definition of triple negative."},{"t":"It occurs more often in premenopausal women and in women with a BRCA1 mutation.","c":true,"r":"Both groups have a higher incidence of triple-negative disease."},{"t":"Chemotherapy is generally more successful than hormone therapy for this cancer.","c":true,"r":"Triple-negative tumors don't respond to hormone therapy, so chemotherapy is the main systemic treatment."},{"t":"Trastuzumab, a HER-2 inhibitor, will target the tumor.","c":false,"r":"The tumor is HER-2 negative, so HER-2 targeted therapy has nothing to target."},{"t":"Tamoxifen will be the first-line systemic therapy.","c":false,"r":"Tamoxifen blocks estrogen receptors. With no estrogen receptors, hormone therapy doesn't work."},{"t":"It is usually slow-growing with a favorable prognosis.","c":false,"r":"These tumors are more aggressive with a poorer prognosis."}],"key":"Triple negative = ER-, PR-, HER-2-. Aggressive, poorer prognosis, no hormone or HER-2 therapy; chemo is the mainstay.","chart":[],"id":7},{"topic":"Breast Cancer","type":"sata","ncj":"Analyze Cues","stem":"Which findings in the pathology report indicate a <b>poorer<\/b> prognosis? <b>Select all that apply.<\/b>","o":[{"t":"HER-2 overexpression","c":true,"r":"HER-2 positive tumors are linked to unusually aggressive growth, greater recurrence risk, and poorer prognosis (though they can be treated with HER-2 targeted drugs)."},{"t":"Estrogen and progesterone receptor positive","c":false,"r":"Receptor-positive tumors tend to be better differentiated and respond to hormone therapy. Receptor-negative tumors carry the worse prognosis."},{"t":"Well-differentiated histologic grade","c":false,"r":"Well-differentiated cells look more like normal cells and are less aggressive."},{"t":"Aneuploid","c":true,"r":"An abnormal number of chromosome sets (aneuploidy) is associated with more aggressive tumors."},{"t":"5 of 12 axillary lymph nodes positive","c":true,"r":"Axillary node involvement is one of the most important prognostic factors. More positive nodes means greater risk of recurrence."},{"t":"Tumor size of 1.4 cm","c":false,"r":"A small tumor (under 2 cm). The larger the tumor, the poorer the prognosis."}],"key":"Poorer prognosis: larger tumor, more positive nodes, poorly differentiated, receptor negative, HER-2 positive, aneuploid.","chart":[{"tab":"Pathology Report","body":"Invasive ductal carcinoma, left breast<br>Tumor size: 1.4 cm<br>Histologic grade: well differentiated<br>Axillary lymph nodes: 5 of 12 positive<br>Estrogen receptor: positive<br>Progesterone receptor: positive<br>HER-2: overexpressed (positive)<br>Ploidy: aneuploid"}],"id":8},{"topic":"Breast Cancer","type":"mc","ncj":"Evaluate Outcomes","stem":"The nurse is teaching a client scheduled for a lumpectomy with sentinel lymph node biopsy (SLNB). Which statement by the client indicates understanding of the SLNB?","o":[{"t":"\"The surgeon will remove all of the lymph nodes under my arm to check them for cancer.\"","c":false,"r":"That describes axillary lymph node dissection (ALND), not SLNB."},{"t":"\"If the first nodes my tumor drains into are free of cancer, I may not need all of my underarm nodes removed.\"","c":true,"r":"SLNB identifies the first node(s) draining the tumor. A negative sentinel node can spare the client a full axillary dissection; a positive one may mean ALND is needed."},{"t":"\"Since only a few nodes are removed, I have no chance of getting lymphedema.\"","c":false,"r":"The risk is lower than with ALND but not zero, so lymphedema precautions are still taught."},{"t":"\"This biopsy will show whether the cancer has spread to my bones or liver.\"","c":false,"r":"SLNB checks regional nodes. Distant spread is assessed with imaging."}],"key":"SLNB = find the first draining node(s). Node status is a key prognostic factor and decides whether a complete ALND is needed.","chart":[],"id":9},{"topic":"Breast Cancer","type":"sata","ncj":"Take Action","stem":"A client is being discharged after a left modified radical mastectomy with axillary lymph node dissection. Which instructions should the nurse include to help prevent lymphedema? <b>Select all that apply.<\/b>","o":[{"t":"\"Keep your weight in a normal range and exercise as instructed.\"","c":true,"r":"Exercise and a normal weight are encouraged to reduce lymphedema risk."},{"t":"\"Wear a snug watch and rings on your left hand for gentle compression.\"","c":false,"r":"Tight jewelry compromises circulation. Compression only comes from properly fitted garments."},{"t":"\"Let your left arm hang at your side for long periods to help fluid drain.\"","c":false,"r":"The arm should not be dependent for long periods. Gravity pulls fluid into the arm."},{"t":"\"Don't allow blood pressures, blood draws, or injections in your left arm.\"","c":true,"r":"These can injure tissue or constrict flow in an arm that can't drain lymph normally."},{"t":"\"You only need these precautions until your incision heals.\"","c":false,"r":"Lymphedema can develop months or years later, so precautions are lifelong."},{"t":"\"Wear gloves when gardening and use an electric razor under your left arm.\"","c":true,"r":"Preventing cuts and infection protects an arm with impaired lymph drainage."},{"t":"\"Use oven mitts when cooking.\"","c":true,"r":"Burns cause inflammation and fluid buildup, so burn prevention is part of the teaching."}],"key":"Lymphedema prevention: no BP, sticks, or injections on that side; avoid dependency, infection, burns, and constriction; exercise and keep a normal weight. Lifelong.","chart":[],"id":10},{"topic":"Breast Cancer","type":"sata","ncj":"Generate Solutions","stem":"A client who had an axillary lymph node dissection 8 months ago says her right arm feels heavy and tight and her rings no longer fit. The right arm measures 3 cm larger than the left. There is no redness, warmth, or fever. Which interventions should the nurse anticipate? <b>Select all that apply.<\/b>","o":[{"t":"Isometric exercises of the affected arm","c":true,"r":"Muscle contraction pumps lymph out of the limb."},{"t":"Complete decongestive therapy using a massage-like technique to move fluid","c":true,"r":"Manual lymph drainage mobilizes fluid that has built up under the skin."},{"t":"Elevating the arm level with the heart","c":true,"r":"Elevation level with the heart promotes drainage."},{"t":"Resting the arm in a sling until the swelling goes down","c":false,"r":"Immobilizing the arm worsens lymph stasis. Exercise is encouraged."},{"t":"Compression bandaging","c":true,"r":"Compression helps move fluid out and keeps it from reaccumulating."},{"t":"A pneumatic compression sleeve","c":true,"r":"Intermittent pneumatic compression is part of acute lymphedema management."},{"t":"Applying a heating pad to the arm","c":false,"r":"Heat increases blood flow and fluid in the tissue and risks burns on an arm that is already vulnerable."}],"key":"Acute lymphedema: decongestive therapy (massage), compression bandaging, pneumatic sleeve, elevate level with heart, isometric exercises. No heat.","chart":[],"id":11},{"topic":"Breast Cancer","type":"mc","ncj":"Take Action","stem":"A client with chronic lymphedema of the left arm after breast cancer surgery calls the clinic. Overnight her left arm became red, hot, and more painful, and she has had chills. Her temperature is 101.4&deg;F (38.6&deg;C). Which action should the nurse take <b>first<\/b>?","o":[{"t":"Teach her to do manual lymphatic massage on the arm","c":false,"r":"Massage is contraindicated while the arm is infected."},{"t":"Advise her to elevate the arm and call back in 48 hours if it isn't better","c":false,"r":"Waiting delays treatment of a spreading infection."},{"t":"Tell her to apply her pneumatic compression sleeve for 2 hours","c":false,"r":"Compression is held during active infection. It can spread infection and increase pain."},{"t":"Arrange for her to be seen by the HCP today for evaluation and likely antibiotics","c":true,"r":"Redness, heat, pain, and fever in a lymphedematous arm point to cellulitis. Infection spreads quickly in that tissue and needs prompt treatment."}],"key":"Lymphedema arm + red, hot, fever = infection. Get treatment started and hold compression and massage until it clears.","chart":[],"id":12},{"topic":"Breast Cancer","type":"sata","ncj":"Take Action","stem":"Which actions should the nurse take? <b>Select all that apply.<\/b>","o":[{"t":"Hold pain medication until pain reaches 8/10 to avoid sedation","c":false,"r":"Analgesics should be given regularly. Uncontrolled pain limits mobility and exercise."},{"t":"Encourage flexion and extension of the fingers, wrist, and elbow and squeezing a soft ball","c":true,"r":"Restoring arm function is a key goal. Gentle hand and arm exercises start early."},{"t":"Check blood pressure on the right arm to monitor for hypovolemia","c":false,"r":"No BPs, venipunctures, or injections on the surgical side."},{"t":"Empty the JP drain, record the amount and color, and re-establish suction by compressing the bulb","c":true,"r":"Routine drain care. Clients often go home with drains, so teaching drain care starts now."},{"t":"Have the client do overhead wall-climbing to full range of motion today","c":false,"r":"Shoulder exercises are progressed gradually per the surgeon's protocol, usually after drains are out. Full abduction on day 1 stresses the incision and drain site."},{"t":"Elevate the right arm on a pillow","c":true,"r":"Elevation promotes lymph and venous drainage from the surgical side."},{"t":"Give the prescribed analgesic, timed before arm exercises","c":true,"r":"Pain should be treated regularly, and premedicating before exercises helps the client participate."}],"key":"Post-mastectomy: elevate arm, premedicate, early hand/wrist/elbow exercises, drain care, protect the affected arm.","chart":[{"tab":"Nurses' Notes","body":"Postop day 1, right modified radical mastectomy.<br>Jackson-Pratt (JP) drain with 45 mL serosanguineous drainage over 8 hours.<br>Pain 6/10. Right arm resting flat at her side on the bed."}],"id":13},{"topic":"Breast Cancer","type":"sata","ncj":"Recognize Cues","stem":"A client finished treatment for breast cancer 2 years ago and is now taking tamoxifen. Which new findings should the nurse recognize as possible signs of metastasis? <b>Select all that apply.<\/b>","o":[{"t":"Yellow sclera and right upper quadrant discomfort","c":true,"r":"Possible liver metastasis."},{"t":"Dry cough and shortness of breath for 3 weeks","c":true,"r":"Possible lung metastasis."},{"t":"Numbness and tingling in the fingers since chemotherapy","c":false,"r":"Peripheral neuropathy is a known chemotherapy adverse effect, not a sign of metastasis."},{"t":"New morning headaches with episodes of blurred vision","c":true,"r":"Possible brain metastasis (increased intracranial pressure)."},{"t":"Persistent low back pain that is worse at night","c":true,"r":"Bone is the most common site of breast cancer metastasis."},{"t":"Hot flashes since starting tamoxifen","c":false,"r":"An expected effect of an estrogen-blocking drug."},{"t":"Serum calcium 11.8 mg/dL with fatigue and constipation","c":true,"r":"Hypercalcemia from bone breakdown is a red flag for bone metastasis."}],"key":"Breast cancer spreads to bone, liver, lungs, and brain. New bone pain, jaundice, cough/dyspnea, neuro changes, or hypercalcemia need follow-up.","chart":[],"id":14},{"topic":"Breast Cancer","type":"mc","ncj":"Take Action","stem":"A premenopausal client with estrogen receptor-positive breast cancer is starting tamoxifen. Which instruction is <b>most<\/b> important for the nurse to include?","o":[{"t":"\"Stop the medication if you have hot flashes, because that means the dose is too high.\"","c":false,"r":"Hot flashes are common and expected. They are not a reason to stop the drug."},{"t":"\"You'll take this for about 3 months, just like chemotherapy.\"","c":false,"r":"Tamoxifen is usually taken for 5 to 10 years."},{"t":"\"Report any unusual vaginal bleeding, calf pain or swelling, or sudden shortness of breath right away.\"","c":true,"r":"Tamoxifen blocks estrogen in breast tissue but acts like estrogen in the uterus and on clotting. It raises the risk of endometrial cancer and DVT/PE."},{"t":"\"Since this drug blocks estrogen, you won't need mammograms anymore.\"","c":false,"r":"Surveillance mammography continues."}],"key":"Tamoxifen red flags: abnormal vaginal bleeding (endometrial cancer), leg pain or swelling, chest pain, or dyspnea (VTE).","chart":[],"id":15},{"topic":"Breast Cancer","type":"sata","ncj":"Recognize Cues","stem":"Which findings require <b>immediate<\/b> follow-up? <b>Select all that apply.<\/b>","o":[{"t":"Crackles, ankle edema, and a 2.4 kg weight gain","c":true,"r":"Trastuzumab (HER-2 targeted therapy) can cause cardiotoxicity and heart failure. The dose is held and cardiac function (LVEF) is checked."},{"t":"Temperature 100.9&deg;F with an ANC of 400/mm&sup3;","c":true,"r":"Fever with severe neutropenia is an oncologic emergency. Cultures and antibiotics need to start quickly."},{"t":"Hemoglobin 10.9 g/dL","c":false,"r":"Mild anemia from bone marrow suppression is expected. Monitor it."},{"t":"Hair thinning","c":false,"r":"Alopecia is expected because hair follicles are rapidly dividing cells."},{"t":"SpO2 92% with a respiratory rate of 24","c":true,"r":"New hypoxemia and tachypnea fit fluid overload from heart failure or infection."},{"t":"Trouble concentrating","c":false,"r":"'Chemobrain' is a known effect. It deserves support and coping strategies but is not an emergency."}],"key":"During chemo: fever + neutropenia is an emergency. With trastuzumab, watch for heart failure (dyspnea, edema, weight gain, crackles).","chart":[{"tab":"Vital Signs","body":"Day 10 after cycle 3 of chemotherapy plus trastuzumab.<br>T 100.9&deg;F (38.3&deg;C), HR 104, RR 24, BP 108/70, SpO2 92% on room air.<br>Weight up 2.4 kg (5.3 lb) since last week."},{"tab":"Assessment","body":"Crackles in both lung bases. 2+ ankle edema. Hair thinning. Reports trouble concentrating ('chemo brain')."},{"tab":"Lab Results","body":"WBC 1,800/mm&sup3;<br>ANC 400/mm&sup3;<br>Hgb 10.9 g/dL<br>Platelets 140,000/mm&sup3;"}],"id":16},{"topic":"Breast Cancer","type":"mc","ncj":"Take Action","stem":"A client is receiving external beam radiation to the breast after a lumpectomy. Which skin care instruction should the nurse give?","o":[{"t":"\"Wash the area gently with lukewarm water and mild soap, pat it dry, and wear loose, soft cotton clothing.\"","c":true,"r":"Gentle cleansing and avoiding friction protect irradiated skin."},{"t":"\"Use a heating pad on the area to relieve soreness.\"","c":false,"r":"Heat further damages irradiated skin."},{"t":"\"Put lotion or deodorant on the area right before each treatment to protect your skin.\"","c":false,"r":"Products on the skin right before treatment can increase the skin reaction. Only HCP-approved products are used, and not just before a session."},{"t":"\"Scrub off the ink markings after each session so they don't irritate your skin.\"","c":false,"r":"The markings guide treatment and must stay."}],"key":"Radiation skin: mild soap, pat dry, loose cotton, no heat, no sun, no products unless approved, leave the markings.","chart":[],"id":17},{"topic":"Breast Cancer","type":"sata","ncj":"Take Action","stem":"A client is scheduled for high-dose-rate balloon catheter brachytherapy (MammoSite) after a lumpectomy. Which statements by the nurse are accurate? <b>Select all that apply.<\/b>","o":[{"t":"\"Treatment may be completed in about 5 days.\"","c":true,"r":"Brachytherapy may require only about 5 treatment days, much shorter than whole-breast external radiation."},{"t":"\"Report redness, drainage, or fever at the catheter site.\"","c":true,"r":"The catheter is a route for infection."},{"t":"\"You'll need daily treatments for about 6 weeks with this method.\"","c":false,"r":"That describes conventional whole-breast external beam radiation."},{"t":"\"The radioactive seed is removed between treatments, so you aren't radioactive to your family.\"","c":true,"r":"With high-dose-rate afterloading, the seed is placed in the balloon for each treatment and then withdrawn."},{"t":"\"This treatment replaces the need for surgery.\"","c":false,"r":"It is given after lumpectomy, not instead of surgery."},{"t":"\"Radiation is delivered directly into the space left after the tumor was removed.\"","c":true,"r":"Brachytherapy is internal radiation delivered into the lumpectomy cavity."}],"key":"Brachytherapy = internal radiation into the lumpectomy cavity, short course (about 5 treatments). Watch the catheter site for infection.","chart":[],"id":18},{"topic":"Breast Cancer","type":"mc","ncj":"Evaluate Outcomes","stem":"A client with stage I breast cancer is deciding between breast conservation surgery and mastectomy. Which statement indicates the client understands the teaching?","o":[{"t":"\"With a lumpectomy, the surgeon removes the tumor and a margin of normal tissue, and I'll usually have radiation afterward.\"","c":true,"r":"Breast conservation = lumpectomy plus radiation to the breast, ending with a boost to the tumor bed."},{"t":"\"If I have a mastectomy, I have to decide on reconstruction now because it can't be done later.\"","c":false,"r":"Reconstruction is optional and can be done at the time of mastectomy or later."},{"t":"\"If I choose a lumpectomy, I won't need any other treatment.\"","c":false,"r":"Radiation usually follows, and some clients also need chemotherapy or hormone therapy."},{"t":"\"A lumpectomy removes my breast and underarm lymph nodes but keeps my chest muscle.\"","c":false,"r":"That describes a modified radical mastectomy."}],"key":"Lumpectomy = tumor + margin, followed by radiation. Modified radical = breast + axillary nodes, pectoralis major kept. Reconstruction is optional, now or later.","chart":[],"id":19},{"topic":"Breast Cancer","type":"sata","ncj":"Analyze Cues","stem":"A 64-year-old man is evaluated for a firm, painless lump beneath his left nipple. Which findings in his history are risk factors for male breast cancer? <b>Select all that apply.<\/b>","o":[{"t":"Takes tamsulosin for BPH","c":false,"r":"Alpha blockers are not linked to breast cancer."},{"t":"Had a vasectomy at age 40","c":false,"r":"Vasectomy is not a risk factor."},{"t":"Took estrogen therapy for prostate cancer","c":true,"r":"Estrogen use is a risk factor in men."},{"t":"His sister and daughter carry a BRCA2 mutation","c":true,"r":"BRCA-positive families raise male breast cancer risk, and genetic testing should be considered."},{"t":"Chest radiation for Hodgkin lymphoma at age 25","c":true,"r":"Radiation exposure is a risk factor."},{"t":"Alcohol-related cirrhosis","c":true,"r":"A damaged liver can't clear estrogen, causing hyperestrogenism."}],"key":"Male breast cancer risk: estrogen use, hyperestrogenism (such as cirrhosis), family history, radiation, BRCA-positive family.","chart":[],"id":20},{"topic":"Breast Cancer","type":"mc","ncj":"Analyze Cues","stem":"The HCP orders an Oncotype DX test for a client with early-stage, estrogen receptor-positive breast cancer. The client asks what the test is for. Which response by the nurse is accurate?","o":[{"t":"\"It counts how many lymph nodes have cancer to determine your stage.\"","c":false,"r":"That's lymph node analysis and TNM staging."},{"t":"\"It's a blood test to see whether you inherited a BRCA mutation your children could carry.\"","c":false,"r":"That's inherited (germline) genetic testing, a different test."},{"t":"\"It looks at the activity of a group of genes in your tumor tissue to estimate how likely the cancer is to come back and whether chemotherapy would help.\"","c":true,"r":"Genomic tests like Oncotype DX analyze tumor tissue to predict behavior and guide the treatment plan."},{"t":"\"It's a scan that shows whether the cancer has spread to other organs.\"","c":false,"r":"Genomic testing is done on tissue, not imaging."}],"key":"Genomic tests (Oncotype DX most common) use tumor tissue to predict recurrence and whether chemo will help.","chart":[],"id":21},{"topic":"Breast Cancer","type":"sata","ncj":"Recognize Cues","stem":"The nurse is teaching breast self-awareness to a group of women. Which changes should the women be taught to report to their HCP? <b>Select all that apply.<\/b>","o":[{"t":"A new lump or thickening","c":true,"r":"Breast cancer is often found as a lump or thickening."},{"t":"A firm ridge of tissue along the lower curve of each breast","c":false,"r":"This is the inframammary ridge, a normal finding. Knowing normal anatomy prevents false alarms."},{"t":"One breast that has been slightly larger than the other since puberty","c":false,"r":"Long-standing mild asymmetry is normal. A new change in size or shape is what to report."},{"t":"Dimpling or puckering of the skin","c":true,"r":"Tumor pulling on supporting ligaments causes dimpling."},{"t":"Red, scaly, or crusted skin on the nipple","c":true,"r":"This can signal Paget disease of the nipple."},{"t":"Lumpiness in both breasts that gets tender before each period","c":false,"r":"Bilateral, cyclic changes are typical of normal breasts or FBC. They should know their normal, but this pattern isn't a warning sign."},{"t":"Spontaneous, bloody discharge from one nipple","c":true,"r":"Unilateral, spontaneous, or bloody discharge needs evaluation."}],"key":"Report: new lump, dimpling, peau d'orange, new nipple retraction, bloody or one-sided discharge, nipple scaling. Know your normal.","chart":[],"id":22},{"topic":"Fibroadenoma","type":"mc","ncj":"Analyze Cues","stem":"A 22-year-old found a breast lump in the shower. The nurse palpates a 2 cm round, firm, rubbery mass with well-defined borders that moves freely under the fingers. It isn't tender, and the client says it hasn't changed size over her last three menstrual cycles. These findings are most consistent with which condition?","o":[{"t":"Mastitis","c":false,"r":"Mastitis causes redness, warmth, pain, and often fever, usually during breastfeeding."},{"t":"Fibrocystic breast condition","c":false,"r":"FBC usually presents as multiple, bilateral, tender lumps that change size with the menstrual cycle."},{"t":"Invasive ductal carcinoma","c":false,"r":"Cancer feels hard, irregular, and fixed, and is uncommon at 22."},{"t":"Fibroadenoma","c":true,"r":"Classic fibroadenoma: young woman, single round, firm, rubbery, very mobile, painless mass that doesn't change with the cycle."}],"key":"Fibroadenoma = young, single, round, rubbery, very mobile, painless, no cyclic change. Biopsy still gives the definitive diagnosis.","chart":[],"id":23},{"topic":"Fibroadenoma","type":"sata","ncj":"Generate Solutions","stem":"The nurse is planning care for a 20-year-old with a suspected fibroadenoma. Which statements reflect appropriate management? <b>Select all that apply.<\/b>","o":[{"t":"Mastectomy is recommended because fibroadenomas usually turn malignant.","c":false,"r":"Fibroadenomas are benign. If removal is wanted, the lump is excised, not the breast."},{"t":"Once cancer is ruled out, observation with regular monitoring is an option.","c":true,"r":"After a benign diagnosis, watching it with regular monitoring is acceptable."},{"t":"Cutting out all caffeine will make the fibroadenoma go away.","c":false,"r":"Caffeine restriction is sometimes suggested for FBC discomfort. It doesn't shrink a fibroadenoma."},{"t":"Biopsy provides the definitive diagnosis.","c":true,"r":"Fibroadenomas are easily found on exam, but biopsy confirms the diagnosis."},{"t":"A normal mammogram is enough to confirm the diagnosis without a biopsy.","c":false,"r":"Imaging can't definitively diagnose a mass. Biopsy can."},{"t":"She should report any change in the size or feel of the lump.","c":true,"r":"Change in a known lump needs to be re-evaluated."}],"key":"Fibroadenoma: confirm with biopsy, then observe with regular monitoring (or excise if it grows or bothers her).","chart":[],"id":24},{"topic":"Fibroadenoma","type":"mc","ncj":"Take Action","stem":"A 44-year-old who had two fibroadenomas removed in her 20s reports a new breast lump. She says, \"It feels just like my old ones, so I'll just keep an eye on it.\" Which response by the nurse is best?","o":[{"t":"\"That's reasonable. Fibroadenomas are benign, so just recheck it in a year.\"","c":false,"r":"Delays evaluation of a new lump in a woman over 40."},{"t":"\"Try cutting back on caffeine, and call us if it's still there in 6 months.\"","c":false,"r":"Delays evaluation and treats it as FBC without a diagnosis."},{"t":"\"Lumps that feel like your old benign lumps don't need to be looked at.\"","c":false,"r":"Feel alone can't rule out cancer. Only biopsy can."},{"t":"\"Because you're over 40, any new breast lump needs to be checked. Let's get you an exam and imaging with your HCP.\"","c":true,"r":"All new breast lesions in women over 40 should be evaluated, whatever her history."}],"key":"Any new breast lump in a woman over 40 gets evaluated, no matter her history.","chart":[],"id":25},{"topic":"Fibroadenoma","type":"sata","ncj":"Analyze Cues","stem":"The nurse is reviewing breast mass characteristics with a nursing student. Which statements about fibroadenoma are accurate? <b>Select all that apply.<\/b>","o":[{"t":"It usually presents as multiple, tender lumps in both breasts.","c":false,"r":"That describes FBC."},{"t":"It may get larger during pregnancy.","c":true,"r":"Fibroadenomas are hormone sensitive and can grow during pregnancy."},{"t":"It is usually painless.","c":true,"r":"Fibroadenomas are typically nontender."},{"t":"It is definitively diagnosed by mammography.","c":false,"r":"Imaging helps characterize it, but biopsy gives the definitive diagnosis."},{"t":"It is usually fixed to the chest wall.","c":false,"r":"Fibroadenomas are freely movable. Fixation suggests malignancy."},{"t":"Its size does not usually change with the menstrual cycle.","c":true,"r":"Unlike FBC, a fibroadenoma doesn't fluctuate with the cycle."},{"t":"It is the most common benign breast tumor in adolescents and young women.","c":true,"r":"Fibroadenomas are most common in teens and women in their 20s and 30s."}],"key":"Fibroadenoma vs FBC vs cancer: fibroadenoma is single, mobile, painless, no cyclic change; FBC is multiple, tender, cyclic; cancer is hard, irregular, fixed.","chart":[],"id":26},{"topic":"Fibrocystic Breast Condition","type":"sata","ncj":"Recognize Cues","stem":"Which findings would support a diagnosis of fibrocystic breast condition (FBC)? <b>Select all that apply.<\/b>","o":[{"t":"Lumps that change size with the menstrual cycle","c":true,"r":"Cyclic size change is typical of FBC."},{"t":"Multiple nodules in both breasts","c":true,"r":"FBC is usually bilateral and multiple."},{"t":"Aspiration yields bloody fluid","c":false,"r":"Bloody (hemorrhagic) fluid is sent for cytology and needs further workup. It does not support a benign cyst."},{"t":"Tenderness that worsens before menses","c":true,"r":"FBC is an exaggerated response to cyclic estrogen and progesterone, so symptoms peak premenstrually."},{"t":"A mass that is still palpable after aspiration","c":false,"r":"A lump that remains after drainage needs imaging and possibly biopsy."},{"t":"Aspiration yields clear, straw-colored fluid and the lump disappears","c":true,"r":"A simple cyst yields clear fluid and collapses when drained."}],"key":"FBC: bilateral, multiple, tender, cyclic. Clear fluid on aspiration is reassuring; bloody fluid or a mass that persists is not.","chart":[{"tab":"Nurses' Notes","body":"36-year-old reports both breasts feel lumpy and sore, worst the week before her period, and better once menses begins.<br>Exam: multiple soft-to-firm, mobile, tender nodules in both upper outer quadrants.<br>HCP aspirates a 1.5 cm cyst in the right breast."}],"id":27},{"topic":"Fibrocystic Breast Condition","type":"mc","ncj":"Take Action","stem":"A 35-year-old with fibrocystic breast condition asks, \"Does this mean I'm more likely to get breast cancer?\" Which response by the nurse is best?","o":[{"t":"\"Yes, fibrocystic breasts double your risk of breast cancer.\"","c":false,"r":"Inaccurate and needlessly frightening."},{"t":"\"Only if you develop more than three cysts.\"","c":false,"r":"There's no such cutoff."},{"t":"\"Fibrocystic changes aren't linked to a higher breast cancer risk, but keep up with screening and report any lump that feels new or different.\"","c":true,"r":"FBC isn't linked to increased risk, but she still needs routine screening and breast awareness."},{"t":"\"No, so you don't need to check your breasts anymore.\"","c":false,"r":"Breast self-awareness still matters, especially with lumpy breasts."}],"key":"FBC is not linked to increased breast cancer risk, but screening and reporting new changes still apply.","chart":[],"id":28},{"topic":"Fibrocystic Breast Condition","type":"sata","ncj":"Generate Solutions","stem":"Which comfort measures should the nurse suggest to a client with painful fibrocystic breast condition? <b>Select all that apply.<\/b>","o":[{"t":"Limit caffeine (coffee, tea, cola, chocolate) and sodium","c":true,"r":"Some women report less tenderness and swelling, and it's low risk to try."},{"t":"Track symptoms in relation to her menstrual cycle","c":true,"r":"A symptom log shows the cyclic pattern and helps her spot changes that aren't cyclic."},{"t":"Wear a well-fitted, supportive bra, even at night if it helps","c":true,"r":"Support reduces breast movement and pain."},{"t":"Take a mild analgesic such as ibuprofen","c":true,"r":"NSAIDs relieve cyclic breast pain."},{"t":"Stop breast self-exams because the lumps make them confusing","c":false,"r":"She should learn her normal pattern, not stop paying attention."},{"t":"Go without a bra so breast tissue isn't compressed","c":false,"r":"Lack of support increases breast movement and pain. A well-fitted supportive bra helps."},{"t":"Expect symptoms to get worse after menopause","c":false,"r":"FBC usually improves after menopause as cyclic hormones decline."}],"key":"FBC comfort: supportive bra, NSAIDs, limit caffeine and sodium, heat or ice, track symptoms. It usually improves after menopause.","chart":[],"id":29},{"topic":"Fibrocystic Breast Condition","type":"mc","ncj":"Analyze Cues","stem":"A client with fibrocystic breast condition asks why her breasts become more painful and lumpy right before her period. Which explanation by the nurse is accurate?","o":[{"t":"\"Bacteria trapped in the milk ducts cause inflammation every month.\"","c":false,"r":"That describes infection, not FBC."},{"t":"\"The lumps are early cancer cells that grow when hormone levels rise.\"","c":false,"r":"FBC is benign."},{"t":"\"Low estrogen before your period makes the tissue shrink and harden.\"","c":false,"r":"The hormone effect is exaggerated stimulation, not deficiency."},{"t":"\"Your breast tissue overreacts to estrogen and progesterone, which causes extra fibrous tissue and fluid-filled cysts.\"","c":true,"r":"FBC is an exaggerated response to cyclic estrogen and progesterone."}],"key":"FBC = exaggerated response to estrogen and progesterone, leading to fibrous tissue and cysts.","chart":[],"id":30},{"topic":"Fibrocystic Breast Condition","type":"sata","ncj":"Analyze Cues","stem":"Which clients have characteristics associated with a higher likelihood of fibrocystic breast condition? <b>Select all that apply.<\/b>","o":[{"t":"A 38-year-old with significant premenstrual symptoms","c":true,"r":"FBC is most common between ages 30 and 50 and is linked to premenstrual abnormalities."},{"t":"A 74-year-old who is postmenopausal and not on hormone therapy","c":false,"r":"FBC typically subsides after menopause without hormone therapy."},{"t":"A 35-year-old who has never used oral contraceptives","c":true,"r":"Never using oral contraceptives is associated with FBC."},{"t":"A 33-year-old who has taken oral contraceptives for 12 years","c":false,"r":"Oral contraceptive use is linked to lower FBC incidence."},{"t":"A 42-year-old with a history of spontaneous abortion","c":true,"r":"A history of spontaneous abortion is associated with FBC."}],"key":"FBC is most common at ages 30 to 50 with premenstrual abnormalities, prior spontaneous abortion, and no oral contraceptive use.","chart":[],"id":31},{"topic":"Pelvic Organ Prolapse","type":"sata","ncj":"Recognize Cues","stem":"A 66-year-old who has had five vaginal births is diagnosed with a cystocele. Which manifestations should the nurse expect? <b>Select all that apply.<\/b>","o":[{"t":"Pain during intercourse that is worse during menses","c":false,"r":"Cyclic dyspareunia suggests endometriosis, and she is postmenopausal."},{"t":"Urinary frequency and urgency","c":true,"r":"The bladder bulging into the anterior vaginal wall causes irritative urinary symptoms."},{"t":"Pressing on the back wall of the vagina to have a bowel movement","c":false,"r":"Splinting the posterior wall points to a rectocele, not a cystocele."},{"t":"Heavy vaginal bleeding","c":false,"r":"Prolapse doesn't cause heavy bleeding. Bleeding after menopause needs workup for endometrial cancer."},{"t":"Leaking urine when she coughs or sneezes","c":true,"r":"Stress incontinence is common with a cystocele."},{"t":"Recurrent urinary tract infections","c":true,"r":"Incomplete bladder emptying leaves residual urine where bacteria grow."}],"key":"Cystocele (bladder, anterior wall) = urinary symptoms. Rectocele (rectum, posterior wall) = bowel symptoms and splinting.","chart":[],"id":32},{"topic":"Pelvic Organ Prolapse","type":"sata","ncj":"Analyze Cues","stem":"Which findings increase this client's risk for pelvic organ prolapse? <b>Select all that apply.<\/b>","o":[{"t":"Chronic cough from COPD","c":true,"r":"Coughing repeatedly raises intra-abdominal pressure against the pelvic floor."},{"t":"Ehlers-Danlos syndrome","c":true,"r":"Connective tissue disorders weaken pelvic support structures."},{"t":"Takes levothyroxine","c":false,"r":"Treated hypothyroidism isn't a prolapse risk factor."},{"t":"BMI 37","c":true,"r":"Obesity increases pressure on the pelvic floor."},{"t":"Works as a librarian","c":false,"r":"A desk job isn't a risk factor. Heavy lifting would be."},{"t":"Chronic constipation with straining","c":true,"r":"Repeated straining weakens pelvic support."},{"t":"Four vaginal births","c":true,"r":"Multiple pregnancies and vaginal births stretch and weaken the pelvic floor."}],"key":"POP risk: aging, multiple pregnancies, obesity, chronic constipation, chronic cough, connective tissue disorders. All weaken or strain the pelvic floor.","chart":[{"tab":"Health History","body":"58-year-old. G4 P4, all vaginal births; one baby weighed 9 lb 8 oz.<br>BMI 37. Chronic constipation with straining.<br>Smokes 1 pack/day; chronic cough from COPD.<br>Has Ehlers-Danlos syndrome.<br>Works as a librarian. Takes levothyroxine."}],"id":33},{"topic":"Pelvic Organ Prolapse","type":"mc","ncj":"Take Action","stem":"The nurse is teaching Kegel exercises to a client with a mild cystocele. Which instruction is correct?","o":[{"t":"\"Practice by stopping your urine midstream every time you go to the bathroom.\"","c":false,"r":"Stopping the stream can be used once to find the muscles, but doing it routinely can cause incomplete emptying and UTIs."},{"t":"\"Tighten your abdominal, buttock, and thigh muscles together for the best results.\"","c":false,"r":"Only the pelvic floor muscles should contract. Using other muscles means the technique is wrong."},{"t":"\"Tighten the muscles you'd use to stop your urine, hold for a count of 3 to 10, relax for the same count, and repeat 10 to 15 times, several times a day.\"","c":true,"r":"Correct technique: isolate the pelvic floor, hold, fully relax, repeat several times daily."},{"t":"\"You should notice a big improvement within 2 or 3 days.\"","c":false,"r":"Improvement usually takes several weeks to a few months of consistent practice."}],"key":"Kegels: isolate the pelvic floor, hold 3 to 10 seconds, relax equally, repeat often. Don't routinely stop urine midstream. Results take weeks.","chart":[],"id":34},{"topic":"Pelvic Organ Prolapse","type":"sata","ncj":"Take Action","stem":"A client with uterine prolapse is fitted with a pessary. Which information should the nurse include in the teaching? <b>Select all that apply.<\/b>","o":[{"t":"A pessary is a removable device that supports the pelvic organs.","c":true,"r":"It gives mechanical support and is a common nonsurgical treatment."},{"t":"Keep regular follow-up visits for vaginal exams.","c":true,"r":"Exams check the fit and look for pressure injury to the vaginal wall."},{"t":"Once it's in place, it's permanent and doesn't need follow-up.","c":false,"r":"Pessaries need ongoing cleaning and checkups."},{"t":"Report foul-smelling discharge, vaginal bleeding, or pain.","c":true,"r":"These can signal infection, irritation, or tissue erosion."},{"t":"Remove and clean it on the schedule your HCP gives you, or come in to have it cleaned.","c":true,"r":"Regular cleaning prevents irritation and infection."},{"t":"The pessary strengthens your pelvic muscles, so the prolapse will be cured.","c":false,"r":"It only supports the organs. Kegels strengthen muscle, and surgery is the definitive repair."},{"t":"Your HCP may prescribe vaginal estrogen cream to protect the tissue.","c":true,"r":"Vaginal estrogen strengthens thin postmenopausal tissue and lowers the risk of erosion."}],"key":"Pessary: removable support device. Clean regularly, report discharge, odor, bleeding, or pain, and keep follow-up exams.","chart":[],"id":35},{"topic":"Pelvic Organ Prolapse","type":"sata","ncj":"Take Action","stem":"A client is being discharged after a posterior colporrhaphy (rectocele repair). Which instructions should the nurse include? <b>Select all that apply.<\/b>","o":[{"t":"Bear down firmly during bowel movements to keep the repair strong.","c":false,"r":"Bearing down stresses the suture line."},{"t":"Avoid sexual intercourse until your surgeon says the area has healed.","c":true,"r":"Protects the vaginal suture line."},{"t":"Use tampons for any vaginal drainage.","c":false,"r":"Nothing goes in the vagina until the surgeon clears it. Use pads."},{"t":"Avoid heavy lifting and standing for long periods for about 6 weeks.","c":true,"r":"Both raise pelvic pressure while the repair heals."},{"t":"Take the prescribed stool softener and avoid straining.","c":true,"r":"Straining puts pressure on the posterior repair."}],"key":"After colporrhaphy: no straining (stool softeners), no heavy lifting or prolonged standing, nothing in the vagina until cleared.","chart":[],"id":36},{"topic":"Pelvic Organ Prolapse","type":"mc","ncj":"Analyze Cues","stem":"A client reports constipation and a feeling that she can't fully empty her bowels. She says she sometimes has to press on the inside back wall of her vagina to have a bowel movement. These findings are most consistent with which condition?","o":[{"t":"Rectocele","c":true,"r":"The rectum bulges into the posterior vaginal wall, trapping stool. Splinting (pressing on the posterior wall) is the classic sign."},{"t":"Endometriosis","c":false,"r":"Endometriosis can cause painful bowel movements during menses, but not the need to splint."},{"t":"Uterine fibroids","c":false,"r":"Large fibroids can cause pressure, but splinting the posterior wall points to a rectocele."},{"t":"Cystocele","c":false,"r":"A cystocele involves the bladder and anterior wall and causes urinary symptoms."}],"key":"Splinting the posterior vaginal wall to defecate = rectocele.","chart":[],"id":37},{"topic":"Endometrial Cancer","type":"sata","ncj":"Recognize Cues","stem":"Which findings increase this client's risk for endometrial cancer? <b>Select all that apply.<\/b>","o":[{"t":"Eight years of combined oral contraceptives","c":false,"r":"Combined OCPs contain progestin and actually lower endometrial cancer risk."},{"t":"Father with colorectal cancer at 46","c":true,"r":"A family history of colorectal cancer (such as Lynch syndrome) raises endometrial cancer risk."},{"t":"BMI 41","c":true,"r":"Fat tissue converts androgens to estrogen, so obesity means more estrogen stimulating the endometrium."},{"t":"Estrogen-only hormone therapy with an intact uterus","c":true,"r":"Unopposed estrogen (no progestin) drives endometrial overgrowth."},{"t":"Never pregnant","c":true,"r":"Nulliparity means more uninterrupted estrogen cycles."},{"t":"Type 2 diabetes","c":true,"r":"Diabetes is a listed risk factor."}],"key":"Endometrial cancer = estrogen exposure: obesity, unopposed estrogen, nulliparity, DM, family history of colorectal cancer. Combined OCPs are protective.","chart":[{"tab":"Health History","body":"61-year-old. BMI 41. Type 2 diabetes. Never pregnant.<br>Took estrogen-only hormone therapy for 6 years; uterus intact.<br>Father diagnosed with colorectal cancer at age 46.<br>Used combined oral contraceptives for 8 years in her 20s and 30s."}],"id":38},{"topic":"Endometrial Cancer","type":"mc","ncj":"Prioritize Hypotheses","stem":"Based on these findings, which condition is the nurse <b>most<\/b> concerned about?","o":[{"t":"Endometrial cancer","c":true,"r":"Postmenopausal bleeding is the cardinal sign, and tamoxifen, obesity, and diabetes all add risk. Any bleeding after menopause needs evaluation."},{"t":"Cervical cancer","c":false,"r":"Cervical cancer can cause bleeding, but tamoxifen, obesity, and diabetes point to the endometrium."},{"t":"Endometriosis","c":false,"r":"Endometriosis subsides after menopause."},{"t":"Ovarian cancer","c":false,"r":"Ovarian cancer usually presents with bloating, early satiety, and pelvic pain, which she denies."}],"key":"Bleeding after menopause = endometrial cancer until proven otherwise. Tamoxifen raises the risk.","chart":[{"tab":"Nurses' Notes","body":"63-year-old reports vaginal spotting several times over the past 3 weeks. Menopause at age 53.<br>Has taken tamoxifen for 3 years after breast cancer. BMI 39. Type 2 diabetes.<br>Denies bloating, early satiety, or pelvic pain."}],"id":39},{"topic":"Endometrial Cancer","type":"mc","ncj":"Generate Solutions","stem":"A client with postmenopausal bleeding is being evaluated for endometrial cancer. Which test will provide the <b>definitive<\/b> diagnosis?","o":[{"t":"Endometrial biopsy","c":true,"r":"Tissue sampling confirms the diagnosis."},{"t":"Pap test","c":false,"r":"A Pap test samples cervical cells and isn't reliable for endometrial cancer. There's no screening test for it."},{"t":"CA-125 level","c":false,"r":"CA-125 is a tumor marker used mainly for ovarian cancer and is not diagnostic."},{"t":"Transvaginal ultrasound","c":false,"r":"Ultrasound measures endometrial thickness and guides the need for biopsy, but it doesn't confirm cancer."}],"key":"No screening test exists for endometrial cancer. Transvaginal ultrasound helps, but biopsy is definitive.","chart":[],"id":40},{"topic":"Endometrial Cancer","type":"sata","ncj":"Take Action","stem":"Which actions should the nurse include in the plan of care? <b>Select all that apply.<\/b>","o":[{"t":"Monitor for urinary retention after the catheter is removed","c":true,"r":"The bladder sits next to the surgical site and may not empty well at first."},{"t":"Ambulate early and keep the SCDs on while she is in bed","c":true,"r":"Pelvic surgery carries a high VTE risk."},{"t":"Listen for bowel sounds and ask about flatus","c":true,"r":"Abdominal surgery slows bowel function."},{"t":"Check the perineal pad for the amount of vaginal bleeding","c":true,"r":"Vaginal bleeding is monitored after hysterectomy."},{"t":"Avoid pillows under the knees and long periods in high Fowler's position","c":true,"r":"Both cause venous pooling in the pelvis and legs."},{"t":"Keep her on strict bedrest for 48 hours to protect the incision","c":false,"r":"Bedrest increases the risk of VTE, pneumonia, and ileus."},{"t":"Restrict oral fluids until the catheter is removed","c":false,"r":"There's no reason to restrict fluids. Adequate hydration supports recovery."}],"key":"After TAH-BSO: watch vaginal bleeding, prevent VTE (ambulate, SCDs, no knee pillows), monitor voiding and bowel return.","chart":[{"tab":"Nurses' Notes","body":"Postop day 1 after total abdominal hysterectomy with bilateral salpingo-oophorectomy (TAH-BSO) for endometrial cancer.<br>Indwelling urinary catheter in place. Sequential compression devices on. Perineal pad in place."}],"id":41},{"topic":"Endometrial Cancer","type":"sata","ncj":"Generate Solutions","stem":"The nurse is presenting a community class on lowering the risk of endometrial cancer. Which information should be included? <b>Select all that apply.<\/b>","o":[{"t":"Keeping a healthy weight lowers risk.","c":true,"r":"Weight management is a key health promotion point."},{"t":"Any bleeding after menopause should be reported promptly.","c":true,"r":"Abnormal bleeding is the main warning sign."},{"t":"An annual Pap test will detect most endometrial cancers early.","c":false,"r":"Pap tests screen for cervical cancer, not endometrial cancer."},{"t":"Stopping combined oral contraceptives early in life lowers risk.","c":false,"r":"Combined OCPs are protective against endometrial cancer."},{"t":"There's no routine screening test for average-risk women, so knowing the warning signs matters.","c":true,"r":"Because there's no screening test, recognizing symptoms leads to early detection."},{"t":"Women with a uterus who take estrogen therapy should also take a progestin.","c":true,"r":"A progestin opposes estrogen's effect on the endometrium."}],"key":"Endometrial cancer prevention: healthy weight, report abnormal bleeding, progestin with estrogen if uterus intact, keep follow-up care.","chart":[],"id":42},{"topic":"Endometrial Cancer","type":"mc","ncj":"Analyze Cues","stem":"A client asks why her obesity increases her risk for endometrial cancer. Which explanation by the nurse is accurate?","o":[{"t":"\"Fat tissue turns other hormones into estrogen, and that extra estrogen without progesterone makes the uterine lining overgrow.\"","c":true,"r":"Adipose tissue converts
